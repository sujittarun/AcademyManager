<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3ed" />
  <link rel="icon" type="image/png" href="assets/branding/favicon.png" />
  <title>Academy Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/console.css?v=16" />
</head>
<body>
  <!-- operator sign-in.
       NEVER put value= on these two inputs. This file has been served
       from GitHub Pages, so a value here is a live operator credential
       on the open web — and it stays in git history after removal.
       On 2026-08-05 exactly that happened: the operator password was
       public on both this console and CourtSync. -->
  <div class="gate" id="gate">
    <form class="gate-card" id="gateForm">
      <img src="assets/branding/logo-full.jpg" alt="Academy Manager — Sports · Operations · Insight" style="width:250px;display:block;margin:0 auto 2px;border-radius:14px" />
      <p>Operator console. Account-level metrics only — member data stays inside each academy.</p>
      <label><span>Email</span><input type="email" name="email" required  placeholder="you@academymanager.in" /></label>
      <label><span>Password</span><input type="password" name="password" required  placeholder="••••••••" /></label>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      "use strict";

      /* ============ platform DB (anon key; RLS-gated) ============ */
      var PROJECT = "https://ugsklcipzyiogxynshnh.supabase.co";
      var BASE = PROJECT + "/rest/v1";
      var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnc2tsY2lwenlpb2d4eW5zaG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUyMzksImV4cCI6MjA5ODQ3MTIzOX0.w7xkjdTkYN2qA0oxMKLUNtua0ScKVHKQzfEyIayh9eo";
      var COURTSYNC_URL = "https://sujittarun.github.io/CourtSync/";

      function amSession() { try { return JSON.parse(localStorage.getItem("am-session")); } catch (e) { return null; } }
      function bearerTok() {
        var s = amSession();
        if (!s || !s.access_token) return Promise.resolve(KEY);
        if (s.expires_at - Date.now() > 90 * 1000) return Promise.resolve(s.access_token);
        return fetch(PROJECT + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: s.refresh_token }),
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j.access_token) throw new Error("expired");
          s.access_token = j.access_token; s.refresh_token = j.refresh_token;
          s.expires_at = Date.now() + (j.expires_in || 3600) * 1000;
          localStorage.setItem("am-session", JSON.stringify(s));
          return s.access_token;
        }).catch(function () { localStorage.removeItem("am-session"); return KEY; });
      }
      function get(path) {
        return bearerTok().then(function (tok) { return fetch(BASE + path, { headers: { apikey: KEY, Authorization: "Bearer " + tok } }); })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(function () { return []; });
      }
      function rpc(name, args) {
        return bearerTok().then(function (tok) {
          return fetch(BASE + "/rpc/" + name, { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) });
        }).then(function (r) {
          // 401/403 must not be swallowed. Every caller does `|| []`, so a
          // silent null renders an empty console — no academies, no error,
          // no hint that the session is the problem. Send the operator back
          // to the gate instead of showing them a blank dashboard.
          if (r.status === 401 || r.status === 403) { signOutToGate("Session expired — please sign in again."); throw new Error(r.status); }
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }).catch(function () { return null; });
      }

      /* ============ sign-in gate ============ */
      var gate = document.getElementById("gate");
      function signOutToGate(msg) {
        localStorage.removeItem("am-session");
        if (!gate) return;
        gate.classList.remove("hide");
        var p = gate.querySelector("p");
        if (p && msg) p.textContent = msg;
      }
      var s0 = amSession();
      // A session with no refresh token cannot be renewed, and one whose
      // refresh window has passed is already dead. Hiding the gate for
      // either leaves the operator staring at an empty console.
      if (s0 && (!s0.access_token || !s0.refresh_token)) { localStorage.removeItem("am-session"); s0 = null; }
      if (s0) gate.classList.add("hide");
      document.getElementById("gateForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var fd = new FormData(this);
        fetch(PROJECT + "/auth/v1/token?grant_type=password", {
          method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
        }).then(function (r) { return r.json(); }).then(function (j) {
          var meta = (j.user && j.user.app_metadata) || {};
          if (j.access_token && meta.am_role === "operator") {
            localStorage.setItem("am-session", JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: j.user.email, role: "operator" }));
            gate.classList.add("hide"); location.reload(); return;
          }
          throw new Error(j.access_token ? "not an operator account" : (j.error_description || "wrong credentials"));
        }).catch(function (err) { alert("Sign-in failed: " + err.message); });
      });

      /* ============ helpers ============ */
      function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
      function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return iso(d); }
      function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
      function inrK(n) { n = Number(n || 0); if (n >= 1e5) { var l = n / 1e5; return "₹" + (l >= 10 ? l.toFixed(1) : l.toFixed(2)) + "L"; } if (n >= 1000) return "₹" + Math.round(n / 1000) + "k"; return "₹" + n; }
      function num(n) { return Number(n || 0).toLocaleString("en-IN"); }
      function fmtDate(s) { try { return new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short" }); } catch (e) { return "—"; } }
      function agoH(h) { if (h == null) return "Never"; if (h < 1) return "Just now"; if (h < 24) return Math.round(h) + "h ago"; return Math.round(h / 24) + "d ago"; }
      var esc = function (s) { var d = document.createElement("i"); d.textContent = String(s == null ? "" : s); return d.innerHTML; };

      var CH = { Website: "#6366f1", Playo: "#10b981", Hudle: "#f59e0b", District: "#3b82f6", "Walk-in": "#94a3b8" };
      function sportIcon(sport) { return ({ Tennis: "sports_tennis", Cricket: "sports_cricket", Football: "sports_soccer", Badminton: "sports_tennis", Swimming: "pool", "Multi-sport": "exercise" })[sport] || "exercise"; }
      function tint(sport) { return ({ Tennis: ["#0f766e", "#f0fdfa"], Cricket: ["#b45309", "#fffbeb"], Badminton: ["#7c3aed", "#f5f3ff"], Football: ["#1d4ed8", "#eff6ff"], "Multi-sport": ["#be123c", "#fff1f2"], Swimming: ["#0369a1", "#f0f9ff"] })[sport] || ["#4b5563", "#f3f4f6"]; }
      function healthStyle(h) { return ({ Active: ["#047857", "#ecfdf5"], Quiet: ["#b45309", "#fffbeb"], "At risk": ["#b91c1c", "#fef2f2"], Onboarding: ["#4338ca", "#eef2ff"] })[h] || ["#475569", "#f1f5f9"]; }
      function billStyle(b) { return ({ paid: ["#047857", "#ecfdf5", "Paid"], pending: ["#b45309", "#fffbeb", "Pending"], overdue: ["#b91c1c", "#fef2f2", "Overdue"] })[b] || ["#b45309", "#fffbeb", "Pending"]; }

      function bars(vals, h, gap) {
        var max = Math.max.apply(null, vals.concat([1]));
        return '<div style="display:flex;align-items:flex-end;gap:' + (gap || 2) + 'px;height:' + h + 'px;width:100%">' +
          vals.map(function (v) { return '<div style="flex:1;min-height:2px;height:' + Math.max(6, Math.round(v / max * 100)) + '%;background:' + (v ? "var(--ac)" : "#eceef2") + ';border-radius:2px 2px 0 0"></div>'; }).join("") + "</div>";
      }
      // premium area+line sparkline (responsive width, crisp non-scaling stroke)
      var _sgn = 0;
      function spark(vals, h, color, draw) {
        color = color || "var(--ac)";
        vals = (vals || []).map(Number);
        if (!vals.length) vals = [0, 0];
        if (vals.length === 1) vals = [vals[0], vals[0]];
        var allZero = vals.every(function (v) { return !v; });
        var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
        var n = vals.length, W = 100, P = 3, ih = h - P * 2;
        function y(v) { var t = max === min ? 0.5 : (v - min) / (max - min); return (P + (1 - t) * ih).toFixed(2); }
        var pts = vals.map(function (v, i) { return (i / (n - 1) * W).toFixed(2) + " " + y(v); });
        if (allZero) { // flat baseline so an idle academy still reads as a line, not empty
          return '<svg class="spark" viewBox="0 0 ' + W + " " + h + '" preserveAspectRatio="none" style="height:' + h + 'px">' +
            '<path d="M0 ' + (h - P) + " L" + W + " " + (h - P) + '" style="stroke:#e2e5ea;stroke-width:1.4" vector-effect="non-scaling-stroke" fill="none"/></svg>';
        }
        var line = "M" + pts.join(" L");
        var area = "M0 " + h + " L" + pts.join(" L") + " L" + W + " " + h + " Z";
        var gid = "sg" + (++_sgn);
        return '<svg class="spark" viewBox="0 0 ' + W + " " + h + '" preserveAspectRatio="none" style="height:' + h + 'px;--len:210">' +
          '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".24"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
          '<path class="ln' + (draw ? " draw" : "") + '" d="' + line + '" style="stroke:' + color + '" vector-effect="non-scaling-stroke"/></svg>';
      }
      function mixBar(mix, h) {
        var keys = Object.keys(mix).sort(function (x, y) { return mix[y] - mix[x]; });
        var total = keys.reduce(function (s, k) { return s + mix[k]; }, 0) || 1;
        if (!keys.length) return '<div style="height:' + h + 'px;border-radius:' + (h / 2) + 'px;background:#eceef2"></div>';
        return '<div style="display:flex;height:' + h + 'px;border-radius:' + (h / 2) + 'px;overflow:hidden;gap:2px">' +
          keys.map(function (k) { return '<div style="width:' + (mix[k] / total * 100) + '%;background:' + (CH[k] || "#b9b7ac") + '"></div>'; }).join("") + "</div>";
      }
      function pill(text, colors, small) {
        var p = small ? "3px 8px 3px 7px" : "3px 10px 3px 8px", fs = small ? "11px" : "11.5px", dot = small ? 5 : 6;
        return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:' + fs + ';font-weight:600;padding:' + p + ';border-radius:20px;background:' + colors[1] + ';color:' + colors[0] + ';white-space:nowrap"><span style="width:' + dot + 'px;height:' + dot + 'px;border-radius:50%;background:' + colors[0] + '"></span>' + esc(text) + "</span>";
      }

      /* ============ state + data ============ */
      var state = { view: "overview", sel: null, sortKey: "gmv", sortDir: "desc", data: [], health: null, loaded: false, ev: {}, evLoading: {},
        // sales pipeline — loaded lazily the first time the tab is opened,
        // so the console's boot cost is unchanged for everyone not selling.
        sales: { pipeline: null, leads: [], ab: null, drafted: {}, loaded: false, loading: false,
                 from: "8297771212", f: { priority: "A", sport: "", stage: "", q: "", callable: true } } };

      // per-tenant raw activity — last 7 days of app events, fetched on demand
      function loadEvents(id) {
        if (state.ev[id] || state.evLoading[id]) return;
        state.evLoading[id] = true;
        get("/events?tenant_id=eq." + encodeURIComponent(id) + "&at=gte." + daysAgo(6) +
          "&order=at.desc&limit=800&select=name,props,page,session_id,at")
          .then(function (rows) {
            state.ev[id] = rows || []; state.evLoading[id] = false;
            if (state.sel === id) render();
          });
      }

      function usageArray(byDay) { var out = []; for (var i = 13; i >= 0; i--) out.push((byDay || {})[daysAgo(i)] || 0); return out; }
      function normWeekly(w) { w = (w || []).slice(-8); while (w.length < 8) w.unshift(0); return w; }
      function mapAccount(r) {
        var cfg = r.config || {}, lastAt = r.last_event_at || null;
        var lastH = lastAt ? (Date.now() - new Date(lastAt)) / 36e5 : null;
        var health = !lastAt ? "Onboarding" : lastH <= 48 ? "Active" : lastH <= 14 * 24 ? "Quiet" : "At risk";
        var renewsPast = r.renews_on && new Date(r.renews_on) < new Date();
        var st = r.sub_status || "";
        var bill = (st === "overdue" || renewsPast) ? "overdue" : (st === "active" || st === "paid") ? "paid" : "pending";
        return {
          id: r.tenant_id, name: r.name, sport: cfg.sport || "Multi-sport", icon: sportIcon(cfg.sport), city: cfg.city || "",
          owner: cfg.owner || "", plan: r.plan || r.tier || "Starter", mrr: r.mrr || 0, health: health,
          gmv: r.gmv_30d || 0, prev: r.gmv_prev || 0, bookings: r.bookings_30d || 0, enq: r.apps_30d || 0,
          players: r.active_players || 0, cap: r.player_cap || 0, sessions: r.sessions_30d || 0, activeDays: r.active_days_30d || 0,
          lastH: lastH, bill: bill, renews: bill === "overdue" ? "Overdue" : (r.renews_on ? fmtDate(r.renews_on) : "—"),
          method: cfg.billing ? "UPI · Autopay" : "—", msgs: r.msgs_30d || 0, msgCost: r.msg_cost_30d || 0,
          errors: r.errors_30d || 0, ver: r.app_ver || "—", totalBk: r.total_bookings || 0, wkday: r.weekday_bookings || 0,
          wkend: r.weekend_bookings || 0, courtRev: r.booker_rev_90d || 0, bookers: r.contacts_count || 0,
          federated: !!r.federated, rollupAt: r.rollup_at || null,
          subStatus: r.sub_status || "",
          tenant: !!cfg.url, tenantUrl: cfg.url || "", mix: r.channel_mix || {}, weekly: normWeekly(r.weekly_gmv), usage: usageArray(r.usage_daily), sub: cfg.sport + " · " + (cfg.city || ""),
        };
      }
      function sortedData() {
        var k = state.sortKey, dir = state.sortDir === "asc" ? 1 : -1, hr = { Active: 4, Quiet: 3, "At risk": 2, Onboarding: 1 };
        return state.data.slice().sort(function (a, b) {
          if (k === "name") return a.name < b.name ? -dir : a.name > b.name ? dir : 0;
          var va, vb;
          if (k === "health") { va = hr[a.health]; vb = hr[b.health]; }
          else if (k === "ago") { va = a.lastH == null ? 1e9 : a.lastH; vb = b.lastH == null ? 1e9 : b.lastH; }
          else { va = a[k] || 0; vb = b[k] || 0; }
          return (va - vb) * dir;
        });
      }

      /* ============ render ============ */
      var root = document.getElementById("root");

      function navBtn(key, label, icon, badge, active) {
        return '<button class="nav-item' + (active ? " active" : "") + '" data-nav="' + key + '"><span class="mi" style="font-size:20px">' + icon + "</span><span>" + label + '</span><span style="flex:1"></span>' +
          (badge ? '<span style="font-size:11px;font-weight:600;background:#fef2f2;color:#dc2626;padding:1px 7px;border-radius:20px">' + badge + "</span>" : "") + "</button>";
      }

      function render() {
        var accts = state.data, isDetail = !!state.sel, view = state.view;
        var sel = isDetail ? accts.filter(function (a) { return a.id === state.sel; })[0] : null;
        var overdue = accts.filter(function (a) { return a.bill === "overdue"; }).length;
        var pendingC = accts.filter(function (a) { return a.bill === "pending"; }).length;
        var billBadge = (overdue + pendingC) || "";
        // how many A-priority prospects are still untouched — the only sales
        // number worth interrupting the operator for
        var sp = state.sales.pipeline;
        var salesBadge = (sp && sp.by_priority && sp.by_stage &&
                          sp.by_stage.new && sp.by_priority.A)
          ? Math.min(sp.by_priority.A, sp.by_stage.new) : "";

        var titles = { overview: ["Portfolio insight", "A live view of revenue, adoption and academy health"], academies: ["Academies", accts.length + " client academies on the platform"], billing: ["Billing", "Subscriptions, invoices & collections"], growth: ["Growth", "Adoption, enquiries & channel performance"], sales: ["Sales pipeline", "Coaching academies in Hyderabad we are selling to"], settings: ["Settings", "Organization & console configuration"] };
        var pageTitle = isDetail ? (sel ? sel.name : "") : titles[view][0];
        var pageSub = isDetail ? (sel ? sel.sub : "") : titles[view][1];

        // sidebar sync-engine card from platform_health
        var h = state.health || {};
        var dead = (h.dead_letters || []).length, gaps = h.gap_count || 0, stale = (h.stale_integrations || []).length;
        var pend = (h.jobs && h.jobs.pending) || 0, oldest = (h.jobs && h.jobs.oldest_pending_mins) || 0;
        var engineBad = dead || gaps || (pend && oldest > 30);
        var engineDot = engineBad ? "#d97706" : "#16a34a", engineRing = engineBad ? "#fef3c7" : "#dcfce7";
        var engineLabel = engineBad ? "Degraded" : "Operational";
        var engineStat = engineBad ? ((gaps || dead || pend) + " to clear") : "99.9%";

        var body =
          (state.loaded && !accts.length ? emptyPortfolio() :
            isDetail ? detailView(sel) :
            view === "overview" ? overviewView(accts, overdue, pendingC) :
            view === "academies" ? academiesView(accts) :
            view === "billing" ? billingView(accts) :
            view === "growth" ? growthView(accts) :
            view === "sales" ? salesView() :
            settingsView());

        root.innerHTML =
          '<div class="app">' +
            '<div class="am-backdrop" data-menu></div>' +
            // sidebar
            '<aside class="am-side">' +
              '<div class="am-brand">' +
                '<img src="assets/branding/logo-mark.jpg" alt="" style="width:54px;height:35px;object-fit:cover;border-radius:10px;flex:none;box-shadow:0 5px 14px -7px rgba(28,72,57,.45)" />' +
                '<div style="min-width:0"><div class="am-wordmark">Academy Manager</div><div class="am-edition">OPERATOR SUITE</div></div>' +
              "</div>" +
              '<nav style="display:flex;flex-direction:column;gap:3px;margin-top:4px">' +
                navBtn("overview", "Insight", "space_dashboard", "", view === "overview" && !isDetail) +
                navBtn("academies", "Academies", "apartment", "", view === "academies" && !isDetail) +
                navBtn("billing", "Billing", "receipt_long", billBadge, view === "billing" && !isDetail) +
                navBtn("growth", "Growth", "trending_up", "", view === "growth" && !isDetail) +
                navBtn("sales", "Sales", "campaign", salesBadge, view === "sales" && !isDetail) +
                navBtn("settings", "Settings", "settings", "", view === "settings" && !isDetail) +
              "</nav>" +
              '<div style="flex:1"></div>' +
              '<div style="border:1px solid var(--bd2);border-radius:12px;padding:12px;background:var(--fill)">' +
                '<div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:0.03em">SYNC ENGINE</div>' +
                '<div style="display:flex;align-items:center;gap:8px;margin-top:9px"><span style="width:8px;height:8px;border-radius:50%;background:' + engineDot + ';box-shadow:0 0 0 3px ' + engineRing + '"></span><span style="font-size:12.5px;font-weight:600">' + engineLabel + '</span><span style="flex:1"></span><span style="font-size:11.5px;color:var(--tx3)">' + engineStat + "</span></div>" +
              "</div>" +
              '<div style="display:flex;align-items:center;gap:10px;padding:12px 6px 2px;margin-top:8px;border-top:1px solid var(--bd2)">' +
                '<div style="width:34px;height:34px;border-radius:50%;background:var(--acs);color:var(--act);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none">RK</div>' +
                '<div style="min-width:0;flex:1"><div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Operator</div><div style="font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">operator@academymanager.in</div></div>' +
                '<span class="mi" data-signout style="font-size:18px;color:var(--tx5);cursor:pointer" title="Sign out">logout</span>' +
              "</div>" +
            "</aside>" +
            // main
            '<main class="am-main">' +
              '<header class="am-top">' +
                '<button class="am-burger am-showm" data-menu aria-label="Menu"><span class="mi">menu</span></button>' +
                (isDetail ? '<button class="btn-g" data-back style="display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--bd-btn);border-radius:8px;padding:6px 11px 6px 8px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;color:#5b6470"><span class="mi" style="font-size:18px">arrow_back</span>Portfolio</button>' : "") +
                '<div style="min-width:0"><h1 style="font-size:17px;font-weight:700;letter-spacing:-0.015em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(pageTitle) + '</h1><div style="font-size:12.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(pageSub) + "</div></div>" +
                '<div style="flex:1"></div>' +
                '<div class="am-search" style="display:flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;width:230px;color:var(--tx3)"><span class="mi" style="font-size:18px">search</span><span style="font-size:13px">Search academies…</span><span style="flex:1"></span><span style="font-size:11px;font-weight:600;border:1px solid #dde0e5;border-radius:5px;padding:0 5px;background:#fff">⌘K</span></div>' +

      function performanceChart(vals) {

        var max = Math.max.apply(null, vals.concat([1]));

        function x(i) { return L + i * ((W - L - R) / (vals.length - 1)); }
        function y(v) { return T + (1 - v / top) * (H - T - B); }
        var pts = vals.map(function (v, i) { return x(i).toFixed(1) + " " + y(v).toFixed(1); });
        var line = "M" + pts.join(" L");
        var area = line + " L" + x(vals.length - 1).toFixed(1) + " " + (H - B) + " L" + L + " " + (H - B) + " Z";
        var grid = [0, .33, .66, 1].map(function (p) {

            '<text x="0" y="' + (gy + 4) + '" class="perf-axis">' + (value ? inrK(Math.round(value)) : "₹0") + "</text>";
        }).join("");

        var li = vals.length - 1, lx = x(li), ly = y(vals[li]);

          '<defs><linearGradient id="performanceArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f7f70" stop-opacity=".22"/><stop offset="1" stop-color="#5f7f70" stop-opacity="0"/></linearGradient></defs>' +
          grid + xlabels + '<path d="' + area + '" class="perf-area"/><path d="' + line + '" class="perf-line"/>' +
          '<line x1="' + lx + '" y1="' + T + '" x2="' + lx + '" y2="' + (H - B) + '" class="perf-guide"/>' +
          '<circle cx="' + lx + '" cy="' + ly + '" r="5" class="perf-dot"/>' +
          '<g class="perf-tip" transform="translate(' + Math.max(L, lx - 78) + " " + Math.max(4, ly - 46) + ')"><rect width="76" height="34" rx="8"/><text x="38" y="14" text-anchor="middle">This week</text><text x="38" y="27" text-anchor="middle">' + inrK(vals[li]) + "</text></g></svg>";

      var SALES_TPL = {
        /* One opener, every sport.

             vaguest word in the sentence.
           · telling a prospect about their own business spends a line saying
             nothing, and 57 of the 112 numbers on this list are
             directory-sourced with scraped branch counts — so asserting
             their centre count risks being wrong on line three. Asking is
             safe; telling is not.
           · the customer reference is gone from message 1 on purpose. Our
             tenants are not names a cold prospect recognises, so naming one
             buys little here while competing with the question. Proof belongs
             in the REPLY, where "who are you?" is the most common thing they
             send and the detail actually lands. Keep tenant specifics out of
             this file either way — it is served on a public site.

           What is left is the academy's own name, what we do, and one
           question about the thing they do by hand every month. Do not edit
           this while the A/B test is running — both arms must send identical
           copy or the result means nothing. */
        _default:
          "Hi \u2014 is this {name}?\n\nI'm from Academy Manager, here in Hyderabad. We build branded apps for coaching academies \u2014 batches, attendance, fees and the parent reminders in one place. Same if you're a coach running classes across a few centres.\n\nAre you still tracking batches on Excel or WhatsApp, and monthly payments/renewals in books?"
      };

      /* The A/B arm comes from the DATABASE, never from the client.
         sales.leads.variant is a stored generated column over the lead id,
         so the console, a manual query and sales_ab_results() cannot
         disagree about who is in which arm — and nothing here can reassign
         a lead mid-test, which would make the result meaningless.
           A = text only
           B = same text, then one screenshot of the dues list */
      var SALES_AB = {
        A: { label: "text only", shot: false },
        B: { label: "+ screenshot", shot: true }
      };

      /* The console's esc() escapes & < > but not the double quote, because
         it round-trips through textContent, where there is no attribute
         context. That is fine everywhere it is used for text — and not fine
         here, because these rows are built from names and URLs scraped off
         third-party web pages, and this view puts them inside href and value
         attributes. A single quote in an academy name would break out of the
         attribute.

         So: escAttr for anything landing in an attribute, and safeUrl for
         the source link, which additionally refuses any scheme that is not
         http(s) — a scraped "javascript:" URL must not become clickable. */
      function escAttr(s) {
        return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function safeUrl(u) {
        return /^https?:\/\//i.test(String(u || "")) ? escAttr(u) : "";
      }

      function salesName(n) {
        var s = String(n || "").split(" / ")[0].trim(), prev;
        // Strip repeatedly until stable. One pass in a fixed order is not
        // enough: "Sportz Village (EduSports) - Hyderabad school cluster"
        // has a bracket that is only *trailing* once the " - suffix" is
        // gone, so a single ordered pass leaves "(EduSports)" behind.
        do {
          prev = s;
          s = s.replace(/\s+[-–]\s+.*$/, "")   // "- Hyderabad school cluster"
               .replace(/\s*\([^)]*\)\s*$/, "") // "(ARTA)", "(Kompally)"
               .trim();
        } while (s !== prev && s.length >= 3);
        return s.length >= 3 ? s : String(n || "").trim();
      }

      function salesMsg(l) {
        return SALES_TPL._default.replace("{name}", salesName(l.name));
      }

      /* Two different things were both called A/B/C, in the same table:
         the priority band (from the 0-10 score) and the A/B test arm. The
         database still stores 'A'/'B'/'C' and 'A'/'B' — those are fine as
         keys — but nothing user-facing shows a bare letter any more.

           priority band  ->  Hot / Warm / Cold
           test arm       ->  Text / Text + image                          */
      var PRI_LABEL = { A: "Hot", B: "Warm", C: "Cold" };
      var PRI_TONE  = { A: "#b45309", B: "#1d4ed8", C: "#6b7280" };
      var ARM_LABEL = { A: "Text", B: "Text + image" };

      var CONF_BADGE = {
        verified:  ["#047857", "#ecfdf5", "verified"],
        directory: ["#b45309", "#fffbeb", "directory"],
        malformed: ["#b91c1c", "#fef2f2", "check"],
        none:      ["#6b7280", "#f3f4f6", "no number"]
      };
      var STAGE_BADGE = {
        new: ["#4b5563", "#f3f4f6"], contacted: ["#1d4ed8", "#eff6ff"],
        replied: ["#047857", "#ecfdf5"], call_booked: ["#7c3aed", "#f5f3ff"],
        demo_done: ["#0e7490", "#ecfeff"], won: ["#047857", "#dcfce7"],
        lost: ["#6b7280", "#f3f4f6"]
      };

      function loadSales() {
        salesPrefetchImage();
        if (state.sales.loading) return;
        state.sales.loading = true;
        var f = state.sales.f;
        Promise.all([
          rpc("sales_pipeline"),
          rpc("sales_leads", {
            p_priority: f.priority || null,
            p_sport: f.sport || null,
            p_stage: f.stage || null,
            p_search: f.q || null,
            p_callable: f.callable ? true : null,
            p_limit: 400
          }),
          rpc("sales_ab_results")
        ]).then(function (r) {
          state.sales.pipeline = r[0] || null;
          state.sales.leads = r[1] || [];
          state.sales.ab = r[2] || null;
          state.sales.loading = false;
          state.sales.loaded = true;
          render();
        });
      }

      function salesAct(id, channel, outcome, direction) {
        rpc("sales_log_touch", {
          p_lead: id, p_channel: channel, p_outcome: outcome,
          p_direction: direction || "out",
          p_sent_from: state.sales.from
        }).then(function () { state.sales.loaded = false; loadSales(); });
      }

      /* Batch-open: the whole point of the sales tab.
         Opens the next N leads of ONE arm in tabs, each pre-filled, and logs
         all of them as drafts in a single round-trip.

         WHY BY ARM. Arm B needs a screenshot attached and arm A does not. A
         mixed batch means deciding that per tab, which is how the wrong thing
         gets sent. Doing all the text-only ones, then all the +shot ones,
         removes the decision.

         WHY DRAFTS. Opening a tab is not sending. Each row then asks; only
         "Yes, sent" marks the lead contacted or counts in the test.

         POPUPS. Browsers allow one window.open per gesture and block the
         rest. There is no way around that from a page, so it is detected and
         reported rather than silently losing nine of ten prospects. */
      /* Arm B's image, on the clipboard.
         wa.me carries text only, so the attachment cannot ride along with the
         opener — that is a WhatsApp limitation, not something to code around.
         The next best thing is to put the PNG on the clipboard when the chat
         opens, so the caller pastes with one keystroke instead of hunting for
         a file: click -> tab opens with the text -> Cmd/Ctrl+V -> Enter.

         The blob is pre-fetched when the tab loads. Fetching it inside the
         click handler works in Chrome but Safari treats the await as ending
         the user gesture and refuses the clipboard write, so it is cached up
         front and the click only writes. */
      var SALES_IMG = "assets/marketing/dashboard-dues.png";
      var salesImgBlob = null, salesImgTried = false;

      function salesPrefetchImage() {
        if (salesImgTried) return;
        salesImgTried = true;
        fetch(SALES_IMG).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.blob();
        }).then(function (b) { salesImgBlob = b; })
          .catch(function () { salesImgBlob = null; });
      }

      function salesCopyImage() {
        if (!salesImgBlob || !window.ClipboardItem ||
            !navigator.clipboard || !navigator.clipboard.write) return false;
        try {
          var item = {}; item[salesImgBlob.type || "image/png"] = salesImgBlob;
          navigator.clipboard.write([new ClipboardItem(item)]);
          return true;
        } catch (e) { return false; }
      }

      var SALES_BATCH = 10;

      function salesBatch(arm) {
        var pool = state.sales.leads.filter(function (l) {
          return l.variant === arm && l.wa_link && !l.do_not_contact &&
                 l.stage === "new" && l.last_outcome !== "opened" &&
                 !(state.sales.drafted || {})[l.id];
        }).slice(0, SALES_BATCH);

        if (!pool.length) {
          window.alert("Nothing left to open in arm " + arm +
            " for this filter.\n\nEither they are all drafted already, or the " +
            "filter has none left. Widen the filter or confirm the ones in flight.");
          return;
        }

        // one clipboard write for the whole batch — the same image goes in
        // every arm-B chat, so it stays on the clipboard across all the tabs
        var copied = arm === "B" ? salesCopyImage() : true;

        var opened = 0, blocked = 0;
        pool.forEach(function (l) {
          var w = window.open(l.wa_link + "?text=" + encodeURIComponent(salesMsg(l)),
                              "_blank", "noopener");
          if (w) { opened++; } else { blocked++; }
        });

        if (arm === "B" && !copied) {
          window.alert("The image is not on your clipboard — copy " +
            "marketing/leads/dashboard-dues-whatsapp.jpg by hand, or arm B goes " +
            "out as text only and the test measures nothing.");
        }
        if (blocked) {
          window.alert(
            blocked + " of " + pool.length + " tabs were blocked by the browser.\n\n" +
            "Allow pop-ups for this site (the icon in the address bar), then " +
            "click again. Only the " + opened + " that opened have been logged, " +
            "so nothing is lost — the rest are still marked new.");
        }

        // log ONLY what actually opened
        var lids = pool.slice(0, opened).map(function (l) { return l.id; });
        if (!lids.length) return;
        if (!state.sales.drafted) state.sales.drafted = {};
        lids.forEach(function (id) { state.sales.drafted[id] = true; });

        rpc("sales_log_batch", {
          p_leads: lids, p_channel: "whatsapp", p_outcome: "opened",
          p_direction: "out", p_template: "opener_" + arm,
          p_sent_from: state.sales.from
        }).then(function (r) {
          if (r && r.skipped) {
            window.alert(r.skipped + " lead(s) were skipped — most likely " +
                         "do-not-contact. " + r.logged + " logged as drafts.");
          }
          state.sales.loaded = false; loadSales();
        });
      }

      function salesConfirmAll(arm) {
        var ids = state.sales.leads.filter(function (l) {
          return l.variant === arm && !l.do_not_contact &&
                 (l.last_outcome === "opened" ||
                  (state.sales.drafted || {})[l.id]);
        }).map(function (l) { return l.id; });
        if (!ids.length) return;
        if (!window.confirm("Mark all " + ids.length + " open draft(s) in arm " +
              arm + " as SENT?\n\nOnly do this if you actually pressed send in " +
              "each tab. This advances them out of the queue and counts them in " +
              "the test.")) return;
        ids.forEach(function (id) { delete state.sales.drafted[id]; });
        rpc("sales_log_batch", {
          p_leads: ids, p_channel: "whatsapp", p_outcome: "sent",
          p_direction: "out", p_template: "opener_" + arm,
          p_sent_from: state.sales.from
        }).then(function () { state.sales.loaded = false; loadSales(); });
      }

      function salesView() {
        var p = state.sales.pipeline, f = state.sales.f;
        var leads = state.sales.leads;

        if (!state.sales.loaded) {
          return '<div style="padding:48px;text-align:center;color:var(--tx4);font-size:13px">Loading pipeline…</div>';
        }

        var kpi = function (label, val, sub, tone) {
          return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px">' +
            '<div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.03em">' + label + "</div>" +
            '<div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;color:' + (tone || "inherit") + '">' + val + "</div>" +
            '<div style="font-size:11.5px;color:var(--tx4);margin-top:2px">' + sub + "</div></div>";
        };
        var pr = (p && p.by_priority) || {}, st = (p && p.by_stage) || {};
        var kpis = '<div class="cardgrid" style="margin-bottom:18px">' +
          kpi("PROSPECTS", (p && p.total) || 0, "coaching academies, Hyderabad") +
          kpi("CALLABLE NOW", (p && p.callable) || 0, ((p && p.verified) || 0) + " own-site verified", "#047857") +
          kpi("HOT LEADS", pr.A || 0, "score 8+ · call this week", "#b45309") +
          kpi("REPLIED", st.replied || 0, ((p && p.replies_7d) || 0) + " replies in 7d") +
          kpi("NO NUMBER", (p && p.no_phone) || 0, "reach by DM or web form") +
          kpi("SUPPRESSED", (p && p.dnc) || 0, "asked us to stop") +
          "</div>";

        // sending number. Recorded on every touch so a restricted sender is
        // traceable to exactly what it had messaged.
        var sender = '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 15px;margin-bottom:16px">' +
          '<span class="mi" style="color:#b45309;font-size:19px">smartphone</span>' +
          '<div style="font-size:12.5px;color:#78350f;flex:1;min-width:220px"><b>Sending from ' + esc(state.sales.from) + '</b> — checked 2026-08-12: the tenant fee-reminder sender is a different number (+91 81439 60950), so outreach cannot affect reminder delivery. Keep them separate — a sender restricted for cold messaging would stop reminders for every academy at once.</div>' +
          '<input id="salesFrom" value="' + escAttr(state.sales.from) + '" style="border:1px solid #fcd34d;border-radius:8px;padding:6px 9px;font-size:12.5px;width:130px;background:#fff" />' +
          "</div>";

        // how many are open in each arm right now
        var draftedIn = function (arm) {
          // count drafts the DATABASE knows about as well as this session's,
          // so "All N sent" still works after a reload
          return leads.filter(function (l) {
            return l.variant === arm && !l.do_not_contact &&
                   (l.last_outcome === "opened" ||
                    (state.sales.drafted || {})[l.id]);
          }).length;
        };
        var queueIn = function (arm) {
          return leads.filter(function (l) {
            return l.variant === arm && l.wa_link && !l.do_not_contact &&
                   l.stage === "new" && l.last_outcome !== "opened" &&
                   !(state.sales.drafted || {})[l.id];
          }).length;
        };
        var armBar = function (arm, tone, what) {
          var q = queueIn(arm), d = draftedIn(arm);
          return '<div style="flex:1;min-width:250px;border:1px solid var(--bd2);border-left:3px solid ' + tone + ';border-radius:10px;padding:12px 14px">' +
            '<div style="font-size:11px;font-weight:700;color:' + tone + '">' + what.toUpperCase() + '</div>' +
            '<div style="font-size:10px;color:var(--tx4);letter-spacing:.02em">test arm ' + arm + "</div>" +
            '<div style="font-size:12.5px;color:var(--tx3);margin-top:4px">' + q + ' waiting' +
            (d ? ' · <b style="color:#b45309">' + d + " open</b>" : "") + "</div>" +
            '<div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">' +
            '<button data-sbatch="' + arm + '"' + (q ? "" : " disabled") +
              ' style="border:none;background:' + (q ? tone : "var(--bd2)") + ';color:#fff;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:' + (q ? "pointer" : "default") + '">Open next ' + Math.min(q, SALES_BATCH) + "</button>" +
            (d ? '<button data-sallsent="' + arm + '" style="border:1px solid #86efac;background:#f0fdf4;color:#166534;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer">All ' + d + " sent</button>" : "") +
            "</div></div>";
        };
        var batchBar = '<div style="background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)">' +
          '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="font-size:14px;font-weight:700">Work the queue</h3>' +
          '<span style="font-size:11.5px;color:var(--tx4)">one group at a time, so you are not deciding about the image tab by tab</span></div>' +
          /* Two axes were both labelled A/B/C and a reader could not tell them
             apart. Nothing shows a bare letter now, and this says so once. */
          '<div style="font-size:11px;color:var(--tx4);margin-top:6px"><b>Priority</b> (Hot / Warm / Cold) is how good the lead is, from its 0\u201310 score. <b>Text</b> vs <b>Text + image</b> is which half of the experiment it is in. Independent \u2014 a Hot lead can be in either.</div>' +
          '<div style="display:flex;gap:12px;margin-top:13px;flex-wrap:wrap">' +
          armBar("A", "#059669", "text only") + armBar("B", "#7c3aed", "text + image") + "</div>" +
          '<div style="font-size:11.5px;color:var(--tx4);margin-top:11px;line-height:1.6">' +
          "Opens up to " + SALES_BATCH + " chats, pre-filled, and logs them as <b>drafts</b> — nothing is marked sent until you say so. " +
          "<b>Allow pop-ups for this site</b> or the browser blocks all but the first tab; if that happens you are told how many, and only the ones that opened are logged. " +
          "<b>Arm B</b>: the image is copied to your clipboard when you open the batch \u2014 in each tab press <b>Cmd/Ctrl+V</b> then Enter. " +
          "wa.me cannot carry an attachment, so this is as close to automatic as WhatsApp allows.</div></div>";

        var chip = function (key, val, label) {
          var on = (f[key] || "") === val || (key === "callable" && !!f.callable === (val === "1"));
          return '<button data-sf="' + key + '" data-sv="' + escAttr(val) + '" style="border:1px solid ' + (on ? "var(--act)" : "var(--bd2)") + ';background:' + (on ? "var(--acs)" : "var(--card)") + ';color:' + (on ? "var(--act)" : "var(--tx2)") + ';border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:' + (on ? "600" : "500") + ';cursor:pointer">' + label + "</button>";
        };
        var sports = {};
        leads.forEach(function (l) { if (l.sport) sports[l.sport.split(" / ")[0]] = 1; });
        var sportOpts = ['<option value="">All sports</option>'].concat(
          Object.keys(sports).sort().map(function (s) {
            return '<option value="' + escAttr(s) + '"' + (f.sport === s ? " selected" : "") + ">" + esc(s) + "</option>";
          })).join("");

        var filters = '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px">' +
          chip("priority", "", "All") + chip("priority", "A", "Hot") +
          chip("priority", "B", "Warm") + chip("priority", "C", "Cold") +
          '<span style="width:1px;height:22px;background:var(--bd2);margin:0 3px"></span>' +
          chip("callable", "1", "Has a number") +
          chip("stage", "new", "Not yet contacted") +
          chip("stage", "replied", "Replied") +
          '<span style="flex:1"></span>' +
          '<select id="salesSport" style="border:1px solid var(--bd2);border-radius:8px;padding:6px 9px;font-size:12.5px;background:var(--card)">' + sportOpts + "</select>" +
          '<input id="salesQ" placeholder="Search name, area, number" value="' + escAttr(f.q || "") + '" style="border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;font-size:12.5px;width:210px;background:var(--card)" />' +
          "</div>";

        var rows = leads.map(function (l) {
          var cb = CONF_BADGE[l.phone_confidence] || CONF_BADGE.none;
          var sb = STAGE_BADGE[l.stage] || STAGE_BADGE.new;
          var prTone = PRI_TONE[l.priority] || "#6b7280";
          var prName = PRI_LABEL[l.priority] || l.priority;
          var alts = (l.alt_phones || []);
          var phoneCell = l.phone
            ? '<span style="font-weight:600;font-variant-numeric:tabular-nums">' + esc(l.phone) + "</span>" +
              (alts.length ? '<span style="font-size:11px;color:var(--tx4)"> +' + alts.length + " alt</span>" : "")
            : '<span style="color:var(--tx4)">—</span>';

          // The arm decides what the caller has to do, so the button says it.
          // A caller who does not know this lead is in the screenshot arm
          // will send the wrong thing and quietly corrupt the experiment.
          var arm = SALES_AB[l.variant] || SALES_AB.A;
          var acts = l.do_not_contact
            ? '<span style="font-size:11.5px;color:#b91c1c;font-weight:600">suppressed</span>'
            /* A draft is in flight if the DATABASE says so — its most recent
               touch is an 'opened' with no send after it — or if this session
               just opened it. Reading only the in-memory map lost every draft
               on reload and showed the WhatsApp button again, which is how
               eight sends went unrecorded. */
            : ((state.sales.drafted || {})[l.id] || l.last_outcome === "opened")
              /* A draft in flight still needs the other outcomes. Replacing
                 the whole cell with just yes/no meant a prospect who replied
                 "stop messaging me" while the draft sat open could not be
                 suppressed without first lying about having sent it. */
              ? '<span style="font-size:11.5px;color:#b45309;font-weight:600">did you send it?</span>' +
                ' <button data-sdone="' + l.id + '" style="border:none;background:#059669;color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer">Yes, sent</button>' +
                ' <button data-sundo="' + l.id + '" style="border:1px solid var(--bd2);background:var(--card);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">No</button>' +
                ' <button data-sact="' + l.id + '|whatsapp|replied|in" style="border:1px solid var(--bd2);background:var(--card);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">Replied</button>' +
                ' <button data-sdnc="' + l.id + '" title="They asked us to stop" style="border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">Stop</button>'
            : (l.wa_link
                ? '<button data-swa="' + l.id + '" title="' + escAttr(
                    arm.shot
                      ? "Arm B: send the opener, then attach ONE screenshot of the dues list (demo tenant only)"
                      : "Arm A: send the opener as text only — no screenshot") +
                  '" style="border:none;background:' + (arm.shot ? "#7c3aed" : "#059669") + ';color:#fff;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer"><span class="mi" style="font-size:14px;vertical-align:-3px">' + (arm.shot ? "image" : "chat") + "</span> " + (ARM_LABEL[l.variant] || l.variant) + "</button>"
                : '<span style="font-size:11.5px;color:var(--tx4)">DM / form</span>') +
              /* Sent, straight out. Messages get sent from a phone, from an
                 existing chat, or before anyone opened the console — and
                 until now the only path to 'sent' was open-then-confirm, so
                 those went unrecorded and the lead kept offering a button. */
              (l.wa_link ? ' <button data-sact="' + l.id + '|whatsapp|sent" title="Already sent it — record that, whatever route it went out by" style="border:1px solid #86efac;background:#f0fdf4;color:#166534;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer">\u2713 Sent</button>' : "") +
              ' <button data-sact="' + l.id + '|call|no_answer" title="Called, no answer" style="border:1px solid var(--bd2);background:var(--card);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">No answer</button>' +
              ' <button data-sact="' + l.id + '|whatsapp|replied|in" title="They replied" style="border:1px solid var(--bd2);background:var(--card);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">Replied</button>' +
              ' <button data-sact="' + l.id + '|whatsapp|not_interested" title="Not interested" style="border:1px solid var(--bd2);background:var(--card);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">No</button>' +
              ' <button data-sdnc="' + l.id + '" title="They asked us to stop — suppresses every lead on this number, permanently" style="border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer">Stop</button>';

          return '<tr style="border-top:1px solid var(--bd3)">' +
            '<td style="padding:11px 10px"><div style="font-size:13px;font-weight:600">' + esc(l.name) + "</div>" +
