          case "client_error": return String(p.msg || "").slice(0, 64);
          default: return e.page || "";
        }
      }
      function evTime(s) { try { return new Date(s).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }

      /* Errors for ONE academy, beside its activity feed — which is where
         you already come to ask "what is this tenant doing?". Resolving
         here is what clears the count on Insight: the two read the same
         server-side list, so there is no second source of truth. */
      function tenantErrorsCard(a) {
        var all = (state.health && state.health.client_errors_24h) || [];
        var mine = all.filter(function (e) { return e.tenant_id === a.id; });
        if (!mine.length) return "";
        return '<section class="insight-card" style="margin-top:20px"><div class="panel-head"><div><span class="eyebrow">APP ERRORS</span>' +
          '<h2>Reported in the last 24 hours</h2><p>Grouped by message and app version. Resolving clears it from Insight until it happens again.</p></div>' +
          '<span class="panel-badge">' + mine.length + ' open</span></div>' +
          '<div class="err-list">' + mine.map(function (x) {
            return '<div class="err-row">' +
              '<div class="err-main">' +
                '<div class="err-msg">' + esc(x.msg || "(no message)") + '</div>' +
                '<div class="err-meta">v' + esc(x.ver || "?") +
                  ' \u00b7 ' + (x.occurrences || 1) + '\u00d7 across ' + (x.sessions || 1) + ' session' + ((x.sessions || 1) === 1 ? "" : "s") +
                  (x.page ? ' \u00b7 ' + esc(x.page) : "") +
                  ' \u00b7 ' + agoH(x.last_seen ? (Date.now() - new Date(x.last_seen).getTime()) / 36e5 : null) +
                '</div>' +
              '</div>' +
              '<button class="btn-g err-resolve" data-resolve="1"' +
                ' data-tenant="' + esc(x.tenant_id) + '"' +
                ' data-msg="' + esc(x.msg || "") + '"' +
                ' data-ver="' + esc(x.ver || "?") + '">' +
                '<span class="mi">check_circle</span>Resolve</button>' +
            '</div>';
          }).join("") + '</div></section>';
      }

      /* Usage as its own card, next to the activity feed. A card rather
         than a line inside activityCard() because it answers a different
         question: the feed says WHAT happened, this says whether anyone is
         there at all and on what. Both matter when a client has just been
         handed a live link and gone quiet. */
      function usageCard(a) {
        return '<section style="background:var(--card);border:1px solid var(--bd);border-radius:16px;' +
          'padding:22px 24px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-top:20px">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--act)">Usage</div>' +
          '<h3 style="font-size:15px;font-weight:700;letter-spacing:-0.01em;margin-top:2px">Are they actually using it?</h3>' +
          usageStrip(a.id) +
          "</section>";
      }

      function activityCard(a) {
        loadEvents(a.id);
        var rows = state.ev[a.id], inner, meta = "";
        if (!rows) {
          inner = '<div style="padding:20px 0;color:var(--tx4);font-size:13px">Loading activity…</div>';
        } else {
          var byDay = {}, sess = {};
          rows.forEach(function (e) {
            var d = iso(new Date(e.at)); (byDay[d] = byDay[d] || []).push(e);
            if (e.session_id) sess[iso(new Date(e.at)) + "|" + e.session_id] = 1;
          });
          var activeDays = Object.keys(byDay).length;
          meta = rows.length ? num(rows.length) + " events · active " + activeDays + " of 7 days" : "";
          if (!rows.length) {
            inner = '<div style="display:flex;align-items:center;gap:11px;padding:20px 0"><span class="mi" style="font-size:22px;color:var(--tx5)">bedtime</span><div><div style="font-size:13px;font-weight:600;color:var(--tx2)">No activity in the last 7 days</div><div style="font-size:12px;color:var(--tx4);margin-top:1px">Nobody from this academy has opened the app.</div></div></div>';
          } else {
            var days = [];
            for (var i = 0; i < 7; i++) {
              var dstr = daysAgo(i), evs = byDay[dstr] || [];
              var label = i === 0 ? "Today" : i === 1 ? "Yesterday" : new Date(dstr + "T12:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
              var daySess = Object.keys(sess).filter(function (k) { return k.indexOf(dstr + "|") === 0; }).length;
              var head = '<div style="display:flex;align-items:center;gap:8px;margin:14px 0 4px"><span style="font-size:12px;font-weight:700;letter-spacing:0.02em;color:' + (evs.length ? "var(--tx2)" : "var(--tx5)") + '">' + label + '</span><span style="flex:1;border-top:1px solid var(--bd3)"></span>' +
                (evs.length ? '<span style="font-size:11.5px;color:var(--tx4);font-variant-numeric:tabular-nums">' + evs.length + " event" + (evs.length > 1 ? "s" : "") + (daySess ? " · " + daySess + " session" + (daySess > 1 ? "s" : "") : "") + "</span>" : '<span style="font-size:11.5px;color:var(--tx5)">No activity</span>') + "</div>";
              var pv = evs.filter(function (e) { return e.name === "page_view"; });
              var acts = evs.filter(function (e) { return e.name !== "page_view"; });
              /* Who did each of these, not just how many there were.

                 The device label is LOOKED UP in the visitor list rather
                 than parsed from the user-agent here: that parse already
                 exists once, in tenant_visitors(), and a second copy in
                 JavaScript is how the same word ends up meaning two
                 things. If the list has not arrived yet the row still
                 shows its IP, which is the part the operator asked for.

                 Rows from a device marked "that's me" are dimmed rather
                 than hidden — the activity genuinely happened, it just
                 is not traction. */
              var vmap = {};
              if (state.visitors && state.visitors.tenant === a.id && state.visitors.rows) {
                state.visitors.rows.forEach(function (r) { vmap[r.visitor] = r; });
              }
              function whoRow(e) {
                var v = vmap[e.visitor], bits = [];
                if (v) bits.push([v.device, v.browser].filter(Boolean).join(" "));
                if (e.ip) bits.push(e.ip);
                if (v && v.is_internal) bits.push(v.label || "mine");
                if (!bits.length) return "";
                return '<div style="font-size:10.5px;color:var(--tx5);white-space:nowrap;overflow:hidden;' +
                       'text-overflow:ellipsis;font-variant-numeric:tabular-nums">' + esc(bits.join(" · ")) + "</div>";
              }
              /* evDetail falls back to the page name, which is useful for
                 a multi-page app (raj: attendance.html, fees.html) and pure
                 noise for a single-page one — every Mezzo row read
                 "app.html". Show it only when it distinguishes anything. */
              var onePage = evs.length > 1 &&
                evs.every(function (x) { return (x.page || "") === (evs[0].page || ""); });
              /* "+14 more actions" used to be a line of dead text: six
                 rows shown, the rest counted and unreachable, on the one
                 panel whose job is to say what happened. The count was
                 right and the operator still could not see them. */
              var dayKey = a.id + "|" + dstr;
              var showAll = !!state.openDays[dayKey];
              var items = (showAll ? acts : acts.slice(0, 6)).map(function (e) {
                var m = evMeta(e.name), d = evDetail(e);
                if (onePage && d === e.page) d = "";
                return '<div class="act-row" style="display:flex;align-items:center;gap:11px;padding:7px 0' + ((vmap[e.visitor] || {}).is_internal ? ';opacity:.45' : '') + '">' +
                  '<div style="width:28px;height:28px;border-radius:8px;background:' + m[2] + ';display:flex;align-items:center;justify-content:center;flex:none"><span class="mi" style="font-size:16px;color:' + m[1] + '">' + m[0] + '</span></div>' +
                  '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(m[3]) + '</div>' + (d ? '<div style="font-size:11.5px;color:var(--tx4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d) + "</div>" : "") + whoRow(e) + "</div>" +
                  /* An error in the feed is the one row you want to act on
                     without going anywhere. Icon only: the row is already
                     tight, and a word here would crowd the timestamp. */
                  (e.name === "client_error"
                    ? '<button class="act-resolve" title="Mark resolved" aria-label="Mark resolved"' +
                        ' data-resolve="1"' +
                        ' data-tenant="' + esc(e.tenant_id || a.id) + '"' +
                        ' data-msg="' + esc(String((e.props || {}).msg || "").slice(0, 90)) + '"' +
                        ' data-ver="' + esc(String((e.props || {}).ver || "?")) + '">' +
                        '<span class="mi">check</span></button>'
                    : "") +
                  '<span style="font-size:11px;color:var(--tx5);white-space:nowrap;font-variant-numeric:tabular-nums">' + evTime(e.at) + "</span></div>";
              }).join("");
              if (acts.length > 6) {
                items += '<button data-moreday="' + esc(dayKey) + '" style="font:inherit;' +
                  'font-size:11.5px;font-weight:600;color:var(--act);background:none;border:0;' +
                  'padding:6px 0 2px 39px;cursor:pointer;text-align:left;width:100%">' +
                  (showAll ? "Show fewer" : "Show all " + acts.length + " — " + (acts.length - 6) + " more") +
                  "</button>";
              }
              if (pv.length) {
                var pages = {};
                pv.forEach(function (e) { var pg = (e.page || "").replace(".html", ""); if (pg) pages[pg] = (pages[pg] || 0) + 1; });
                var pgKeys = Object.keys(pages).sort(function (x, y) { return pages[y] - pages[x]; }).slice(0, 4);
                items += '<div style="display:flex;align-items:center;gap:11px;padding:7px 0"><div style="width:28px;height:28px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;flex:none"><span class="mi" style="font-size:16px;color:#4b5563">visibility</span></div><div style="flex:1;min-width:0;font-size:12px;color:var(--tx3)">' + pv.length + " page view" + (pv.length > 1 ? "s" : "") + (pgKeys.length ? " · " + esc(pgKeys.join(", ")) : "") + "</div></div>";
              }
              days.push(head + items);
            }
            inner = days.join("");
          }
        }
        return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04)"><div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:14px;font-weight:700;letter-spacing:-0.01em">Activity · last 7 days</h3>' + (meta ? '<span style="font-size:12px;color:var(--tx4)">' + meta + "</span>" : "") + '</div><div style="margin-top:4px">' + inner + "</div></div>";
      }

      /* ============ People & access =============================
         Who can sign in to one academy's app. The read is a normal RPC
         (list_staff_access, which reads auth.users behind a definer guard);
         every write goes through the access-admin edge function above.

         THERE ARE NO PASSWORDS ON THIS SCREEN — no field, no display, no
         prompt. Creating someone returns a ONE-TIME SETUP LINK that the
         person opens to choose their own. "Send setup link" is that same
         mechanism, so a reset and a create are one path and the insecure
         one never has to exist. This is not a preference: passing a
         password from here to a client has published four live credentials
         on this platform, one of which is still readable on GitHub. A link
         expires; a password sent over WhatsApp is forever.

         And no role but Manager and Coach. The function refuses to mint an
         operator, so the select must not imply otherwise. */

      /* Where each academy's people sign in — the setup link lands here.
         >>> UPDATE THIS WHEN A TENANT'S APP MOVES. <<<
         An academy not listed here simply gets no redirectTo: the link
         still works, it just lands on the project's default page. That is
         the right failure — sending a new manager to the wrong academy's
         app is worse than sending them somewhere plain. */
      /* EVERY SETUP LINK LANDS ON THE SAME PAGE, wearing the academy's
         name and colour. `?t=<tenant>` picks the branding.

         It used to be one destination per app, pointing at each app's
         login.html — and a sign-in page has nothing that reads a
         recovery fragment, so the link landed on a form and did nothing.
         Two of them were not even pages: MatchPointPride is a
         single-page app with no login.html, and genalphaacademy.in has
         none either. Both returned 404, which is how "reset is not
         working for MPP" looked from the outside.

         One page, because the alternative is a reset page per app and
         eight chances for one of them to rot unnoticed. reset.html is on
         this origin, is deployed with the console, and demonstrably
         reads the fragment. SKAcademy has its own working reset.html;
         it is no longer linked from here, deliberately, so there is one
         mechanism rather than two. */
      var RESET_PAGE = "https://sujittarun.github.io/AcademyManager/reset.html";
      function appLoginFor(id) { return RESET_PAGE + "?t=" + encodeURIComponent(id || ""); }

      /* Say out loud when an academy has no setup page of its own, rather
         than quietly sending its people somewhere generic. */

      var access = {
        tenant: null,        // which academy `rows` describes
        rows: null,          // null until the first read answers
        loading: false,
        /* People who used join.html and are waiting on a decision. */
        reqs: null, reqsFor: "", reqsLoading: false,
        error: "",           // the read failed
        msg: "",             // a write was refused — shown verbatim
        busy: "",            // "<verb>:<email>", so one row's button can say so
        link: "", linkFor: "",
        centres: null, centresFor: null,
        role: "staff",
        form: { name: "", email: "", centres: [] },
      };

      /* Fetched during render behind a guard, the same shape loadEvents()
         uses: the card asks for what it needs and re-renders when it
         arrives. `force` is the path taken after every write. */
      function accessLoad(id, force) {
        if (!id) return;
        if (id !== access.tenant) {
          /* Moved to a different academy. A setup link is a bearer
             credential until it is spent, so it does not follow. */
          access.tenant = id; access.rows = null; access.error = ""; access.msg = ""; access.failed = false;
          access.link = ""; access.linkFor = ""; access.linkKind = ""; access.busy = "";
          access.role = "staff"; access.form = { name: "", email: "", centres: [] };
          access.reqs = null; access.reqsFor = ""; access.reqsLoading = false;
        } else if (!force && (access.rows !== null || access.loading || access.failed)) {
          /* access.failed is what stops a failed read looping. Without it
             rows stays null, the guard lets the next render() call
             straight through, that read fails too, and the console fires
             an unbounded stream of requests for as long as the operator
             sits on the page — re-running signOutToGate each time on a
             401. loadEvents() latches by storing `rows || []`; this reads
             a real distinction between "empty" and "broken", so it needs
             its own flag rather than that trick. */
          return;
        }
        if (force) access.failed = false;
        access.loading = true;
        rpc("list_staff_access", { p_tenant: id }).then(function (rows) {
          if (access.tenant !== id) return;             // the operator moved on
          access.loading = false;
          if (rows == null) {
            access.error = "Could not read who can sign in to this academy.";
            access.failed = true;
          } else {
            access.error = ""; access.failed = false; access.rows = rows;
          }
          render();
        });
      }

      /* The centre list is only needed to scope a coach, and to name the
         centres a coach already has. Operators can read centres directly:
         the select policy is `auth_role() = 'operator' or (staff and own
         tenant)`. */
      function accessCentres(id) {
        if (!id || access.centresFor === id) return;
        access.centresFor = id; access.centres = null;
        get("/centres?tenant_id=eq." + encodeURIComponent(id) + "&select=id,name,short_name&order=sort,name")
          .then(function (rows) {
            if (access.centresFor !== id) return;
            access.centres = rows || [];
            render();
          });
      }

      function accessRow(email) {
        var rows = access.rows || [], i;
        for (i = 0; i < rows.length; i++) if (String(rows[i].email) === String(email)) return rows[i];
        return null;
      }

      /* Returns HTML-safe text either way. */
      function accessCentreNames(p) {
        var ids = p.centre_ids || [];
        if (!ids.length) return "no centres";
        if (!access.centres) return ids.length + (ids.length === 1 ? " centre" : " centres");
        var byId = {};
        access.centres.forEach(function (c) { byId[c.id] = c.short_name || c.name; });
        return esc(ids.map(function (i) { return byId[i] || ("centre " + i); }).join(", "));
      }

      /* A coach who can sign in and reach nothing. Two ways to get there:
         no staff_scopes row / no centres on it (needs_scope), or a scope
         that has been switched off. Both look like a broken app to the
         person, so both are a warning here rather than a quiet state. */
      function accessBlind(p) {
        if (p.role !== "coach") return "";
        if (p.needs_scope) return "No centres yet";
        if (p.has_scope && p.scope_active === false) return "Centres switched off";
        return "";
      }

      function accessStatus(p) {
        if (p.banned) return pill("Suspended", ["#b91c1c", "#fef2f2"], true);
        var blind = accessBlind(p), out = "";
        if (blind) out += pill(blind, ["#b45309", "#fffbeb"], true);
        if (!p.last_sign_in) out += (out ? " " : "") + pill("Never signed in", ["#475569", "#f1f5f9"], true);
        else if (!out) out = '<span style="font-size:12px;color:var(--tx4);white-space:nowrap">Last signed in ' + fmtDate(p.last_sign_in) + "</span>";
        return out;
      }

      function accessBtn(verb, email, label, icon, danger) {
        var busy = access.busy === verb + ":" + email;
        return '<button class="btn-g err-resolve" data-acc="' + verb + '" data-acc-email="' + escAttr(email) + '"' +
          (busy ? " disabled" : "") + (danger ? ' style="color:#b91c1c"' : "") + ">" +
          '<span class="mi">' + (busy ? "hourglass_empty" : icon) + "</span>" +
          (busy ? "Working…" : label) + "</button>";
      }

      function accessPersonRow(p) {
        var email = String(p.email || "");
        var isCoach = p.role === "coach";
        var roleLabel = p.role === "staff" ? "Manager" : isCoach ? "Coach" : String(p.role || "unknown");
        var roleChip = '<span style="font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:' +
          (isCoach ? "#f5f3ff;color:#6d28d9" : "var(--acs);color:var(--act)") + '">' + esc(roleLabel) + "</span>";
        /* A suspended person cannot sign in at all, so the "will reach
           nothing" warning is not true of them and only muddies the row. */
        var blind = p.banned ? "" : accessBlind(p);
        var sub = esc(email) + (isCoach ? " · " + accessCentreNames(p) : "");
        var warn = blind
          ? '<div style="font-size:11.5px;color:#b45309;margin-top:4px;line-height:1.45">Can sign in, but every screen will be empty. Add them again below with the same email and pick their centres.</div>'
          : "";

        var buttons = accessBtn("link", email, "Send setup link", "link") +
          /* "Replace sign-in secret" hands you a value to pass on directly.
             The setup link above is still the better habit — it means no
             credential ever sits in your WhatsApp history — but a login you
             can read down the phone is the real workflow, and pretending
             otherwise just pushes it somewhere less careful. */
          accessBtn("secret", email, "Replace sign-in secret", "key") +
          (p.banned ? accessBtn("restore", email, "Restore", "lock_open")
                    : accessBtn("suspend", email, "Suspend", "block")) +
          accessBtn("delete", email, "Delete", "delete", true);

        return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--bd3)">' +
          '<div style="min-width:190px;flex:1 1 210px">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:13.5px;font-weight:600;color:var(--tx)">' + esc(p.name || email) + "</span>" + roleChip + "</div>" +
            '<div style="font-size:12px;color:var(--tx4);margin-top:3px;word-break:break-word">' + sub + "</div>" + warn +
          "</div>" +
          /* 0 1 auto, not 0 0 auto: a flex item at its content width cannot
             shrink, so on a phone the three buttons ran off the card edge
             instead of wrapping onto a second line. */
          '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:0 1 auto;min-width:0">' + accessStatus(p) + "</div>" +
          '<div style="display:flex;gap:7px;flex-wrap:wrap;flex:0 1 auto;min-width:0">' + buttons + "</div>" +
        "</div>";
      }

      /* Shown as text, never as an <a>. Opening a recovery link spends it,
         so a well-meant click by the operator would burn the one thing the
         person needs. */
      /* The operator's own reset link. Same rules as every other link
         this console shows: rendered as TEXT, never as an <a>, because
         opening a recovery link spends it — and a self-inflicted click
         would burn the one thing they need to get back in. */
      function myLinkBox() {
        if (!state.myLink) return "";
        return '<div style="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;' +
          'width:min(560px,calc(100vw - 28px));padding:14px 16px;border:1px solid var(--ac);' +
          'background:var(--card);border-radius:14px;box-shadow:0 18px 50px rgba(16,24,40,.28)">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--act)">Reset your password</div>' +
          '<div id="myLink" style="margin-top:8px;padding:9px 11px;background:var(--bg2);border:1px solid var(--bd-btn);' +
          'border-radius:9px;font-size:12px;color:var(--tx2);word-break:break-all;user-select:all">' + esc(state.myLink) + "</div>" +
          '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
            '<button class="btn-g err-resolve" data-my-copy><span class="mi">content_copy</span>Copy link</button>' +
            '<button class="btn-g err-resolve" data-my-dismiss>Done</button>' +
          "</div>" +
          '<div style="margin-top:9px;font-size:11.5px;line-height:1.5;color:var(--tx3)">Open this in a browser to choose a new password. It is single-use and expires, so do not open it here — copy it first if you want it on another device.</div>' +
        "</div>";
      }

      function accessLinkBox() {
        var isSecret = access.linkKind === "secret";
        var title = isSecret ? "New sign-in secret" : "Setup link";
        var copy  = isSecret ? "Copy" : "Copy link";
        /* The two cases fail in opposite ways, so they say opposite things.
           A setup link must NOT be opened by the operator (opening spends
           it); a secret must be copied NOW (it is never shown again). */
        var note = isSecret
          ? 'Their old one stopped working the moment this was issued. It is shown <b>once</b> — nothing stores it, so if you lose it you issue another. Send it in a way you would be happy to have kept forever, because whatever you send it in usually is.'
          : 'Send this to them. They open it once to choose their own password, and it expires — issue a fresh one with <b>Send setup link</b> if it lapses. Do not open it yourself: opening it spends it.';
        return '<div style="margin-top:14px;padding:13px 14px;border:1px solid var(--ac);background:var(--acs);border-radius:12px">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--act)">' + esc(title) + "</div>" +
          '<div style="font-size:12.5px;font-weight:600;color:var(--tx2);margin-top:3px;word-break:break-all">' + esc(access.linkFor) + "</div>" +

        var adoptFacts = facts([["App events · 30d", num(a.events30)], ["Active days", a.activeDays + " / 30"], ["Last ping", agoH(a.lastH)], ["App build", a.ver === "—" ? "—" : "v" + a.ver], ["Errors · 30d", String(a.errors), a.errors ? "#dc2626" : "#16a34a"]]);
        var bookFacts = facts([["Bookings · all time", num(a.totalBk)], ["Weekday / weekend", num(a.wkday) + " / " + num(a.wkend)], ["Court revenue · 90d", inr(a.courtRev)], ["Unique bookers", num(a.bookers)]]);

        /* Moving an academy from trial to paying used to mean opening a
           SQL editor against production. The console read subscriptions
           and could not write them, which is a poor reason to be typing
           `update ... where` by hand on a live database. */
        function billingControl(a) {
          var statuses = ["trial", "active", "overdue", "pilot", "cancelled"];
          return '<div class="billing-edit">' +
            '<div class="billing-edit__label">Change billing</div>' +
            '<div class="billing-edit__row">' +
              '<select id="subStatus">' +
                statuses.map(function (st) {
                  return '<option value="' + st + '"' + (st === (a.subStatus || "") ? " selected" : "") + ">" + st + "</option>";
                }).join("") +
              "</select>" +
              '<span class="billing-edit__money"><input id="subMrr" type="number" min="0" step="1" ' +
                'aria-label="Monthly amount" value="' + Number(a.mrr || 0) + '" /></span>' +
            "</div>" +
            '<button class="billing-edit__save" data-setsub="' + esc(a.id) + '">Save</button>' +
            '<div class="billing-edit__hint">' +
              "<b>active</b> shows as Paid. A renewal already past reads Overdue whatever the status, so marking someone paid moves it on a month." +
            "</div></div>";
        }

        /* Who opened the link.
           Built because "294 events in two days" could not answer the only
           question that mattered after sending a link out: was any of that
           somebody other than me. The counts alone never could — my Mac and
           my phone are events too, and they share a home IP with anyone
           else on that network.

           So identity is per DEVICE, not per address: a durable id the app
           keeps in localStorage, paired with an IP, user-agent, country and
           Cloudflare edge that the SERVER reads off the request. A page
           cannot send those — the column grant refuses the insert outright —
           so a visitor cannot claim to be someone else, and neither can a
           developer testing in a second browser.

           "That's me" marks a device as ours and drops it out of the real
           count, because the device you test from changes far more often
           than anyone edits a config file. */
        function visitorCard(a) {
          var v = state.visitors;
          if (!v || v.tenant !== a.id || v.loading) {
            return card("Who opened it · 14d", "distinct devices, not page loads",
              '<div style="margin-top:10px;font-size:12.5px;color:var(--tx4)">Reading visitors…</div>');
          }
          if (v.rows === null) {
          return card("Who opened it · 14d", "distinct devices, not page loads",
            '<div style="margin-top:10px;font-size:12.5px;color:var(--warn,#b45309)">Could not read visitors. This is not the same as nobody having visited.</div>');
        }
        var rows = v.rows;
          var real = rows.filter(function (r) { return !r.is_internal; });
          var mine = rows.length - real.length;
          var acted = real.filter(function (r) { return r.did_something; }).length;

          if (!rows.length) {
            return card("Who opened it · 14d", "distinct devices, not page loads",
              '<div style="margin-top:10px;font-size:12.5px;color:var(--tx4)">Nobody has opened this tenant\'s app in 14 days.</div>');
          }

          var head = '<div style="display:flex;gap:18px;margin:14px 0 4px;flex-wrap:wrap">' +
            '<div><div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">' + real.length + '</div><div style="font-size:11.5px;color:var(--tx4)">real device' + (real.length === 1 ? "" : "s") + '</div></div>' +
            '<div><div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">' + acted + '</div><div style="font-size:11.5px;color:var(--tx4)">did more than look</div></div>' +
            (mine ? '<div><div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx4)">' + mine + '</div><div style="font-size:11.5px;color:var(--tx4)">mine, excluded</div></div>' : "") +
            "</div>";

          var list = rows.map(function (r) {
            var who = [r.device, r.browser].filter(Boolean).join(" · ") || "Unknown device";
            var loc = [r.country, r.edge].filter(Boolean).join(" · ");
          /* device/browser/os are read off the request by the server; `form`
             is what the PAGE thought it was, which is a viewport bucket and
             says "phone · <400" for a narrow window on this Mac. Shown, but
             plainly labelled as the page's opinion — conflating the two is
             what made this panel call the owner's Mac a phone. */
          var seen = r.form ? '<span title="what the page reported: a layout bucket, not hardware">page saw ' + esc(r.form) + "</span>" : "";
            var when = r.last_seen ? fmtDate(r.last_seen) : "—";
            var did = r.actions ? esc(r.actions) : "only looked at pages";
            return '<div style="padding:11px 0;border-top:1px solid var(--bd3);opacity:' + (r.is_internal ? ".5" : "1") + '">' +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
                '<span style="font-size:13px;font-weight:600">' + esc(who) + "</span>" +
                (r.is_internal ? '<span style="font-size:10.5px;font-weight:700;color:var(--tx4);border:1px solid var(--bd2);border-radius:5px;padding:0 5px">MINE</span>'
                               : (r.did_something ? '<span style="font-size:10.5px;font-weight:700;color:#16a34a;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:5px;padding:0 5px">USED IT</span>' : "")) +
                '<span style="flex:1"></span>' +
                '<button data-mine="' + esc(r.visitor) + '" data-mine-on="' + (r.is_internal ? "0" : "1") + '" style="font:inherit;font-size:11.5px;font-weight:600;color:var(--tx3);background:#fff;border:1px solid var(--bd-btn);border-radius:7px;padding:3px 9px;cursor:pointer">' + (r.is_internal ? "Not me" : "That\'s me") + "</button>" +
              "</div>" +
              '<div style="font-size:11.5px;color:var(--tx4);margin-top:3px;font-variant-numeric:tabular-nums">' +
                esc(r.ip || "no ip") + (loc ? " · " + esc(loc) : "") + (r.os ? " · " + esc(r.os) : "") + " · " + r.visits + " visit" + (r.visits === 1 ? "" : "s") +
                " · " + r.events + " event" + (r.events === 1 ? "" : "s") + " · last " + esc(when) + (seen ? " · " + seen : "") +
              "</div>" +
              '<div style="font-size:11.5px;color:var(--tx3);margin-top:3px">' + did + "</div>" +
            "</div>";
          }).join("");

          return card("Who opened it · 14d", "distinct devices, not page loads", head + list);
        }

        return header +
          '<div class="kpis" style="margin-bottom:20px">' + kpis + "</div>" +
          '<div class="dgrid"><div style="display:flex;flex-direction:column;gap:20px">' +
            card("Gross volume", "weekly · last 8 weeks", '<div style="margin-top:18px">' + bars(a.weekly, 92, 8) + '</div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--tx5)"><span>8 wks ago</span><span>this week</span></div>') +
            (a.totalBk ? card("Booking channels · 30d", "", '<div style="margin-top:18px">' + mixBar(a.mix, 12) + '</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px">' + mixLegend + "</div>") : "") +
            activityCard(a) +
            usageCard(a) +
          "</div><div style=\"display:flex;flex-direction:column;gap:20px\">" +
            card("Work recorded", "what the academy actually did", '<div style="margin-top:6px">' + workFacts + "</div>") +
            card("Plan &amp; billing", "", '<div style="margin-top:6px">' + planFacts + "</div>" + billingControl(a)) +
            visitorCard(a) +
            card("App telemetry · 30d", "software health, not business volume", '<div style="margin-top:6px">' + adoptFacts + "</div>" +
              (a.usage && a.usage.length ? '<div style="margin-top:16px">' + bars(a.usage, 34, 3) + '</div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--tx5)"><span>14 days ago</span><span>today</span></div>' : "")) +
            /* Only for tenants that take bookings. raj is coaching-only and
               genalpha has none, so this panel was four dashes on half the
               portfolio — and a dash reads as "broken", not "not applicable". */
            (a.totalBk ? card("Court bookings", "", '<div style="margin-top:6px">' + bookFacts + "</div>") : "") +
          "</div></div>" +
          /* Full width, directly below Plan & billing rather than inside
             it: the right-hand column is 1fr of a 1.5fr:1fr grid, and a
             row carrying a name, an email, a role, a status and three
             buttons will not fit in it. card() is hoisted, so the
             onboarding branch above can reach it too. */
          accessCard(a, card) + tenantErrorsCard(a);
      }

      /* ============ WhatsApp reminder performance ============
         One RPC returns the whole dashboard already aggregated, so no
         raw event ever reaches this browser — which is both the privacy
         position (parents' numbers stay in the database) and the reason
         it stays fast at >1000 events. */
      var wa = { open: false, tenant: "all", months: 4, sort: "remindersSent", data: null, loading: false, error: null };

      function waLoad() {
        wa.loading = true; wa.error = null; render();
        rpc("whatsapp_reminder_stats", { p_tenant: wa.tenant, p_months: wa.months })
          .then(function (r) {
            wa.loading = false;
            if (!r || r.success !== true) { wa.error = "The statistics service did not answer."; }
            else { wa.data = r; }
            render();
          })
          .catch(function () { wa.loading = false; wa.error = "Could not reach the statistics service."; render(); });
      }
      function waOpen() { wa.open = true; wa.tenant = "all"; wa.data = null; waLoad(); }
      function waClose() { wa.open = false; wa.data = null; wa.error = null; render(); }

      function waPct(v) { return v == null ? "—" : v + "%"; }
      function waMoney(n) { return inrK(Number(n || 0)); }

      function waTiles(t) {
        var noDelivery = !t.hasDeliveryData;
        return '<div class="wa-tiles">' +
          '<div class="wa-tile"><span>Reminders sent</span><strong>' + num(t.remindersSent) + '</strong><small>' + num(t.uniquePlayers) + ' unique players</small></div>' +
          '<div class="wa-tile"><span>Academies using</span><strong>' + num(t.academiesUsing) + '</strong><small>with at least one reminder</small></div>' +
          '<div class="wa-tile"><span>Payments via reminder</span><strong>' + num(t.paymentsViaReminder) + '</strong><small>' + num(t.proofs) + ' proofs received</small></div>' +
          '<div class="wa-tile"><span>Revenue via reminder</span><strong>' + waMoney(t.revenueViaReminder) + '</strong><small>confirmed payments only</small></div>' +
          '<div class="wa-tile"><span>Delivery rate</span><strong>' + (noDelivery ? "—" : waPct(t.deliveryRate)) + '</strong><small>' + (noDelivery ? "no callbacks yet" : "of reminders sent") + '</small></div>' +
          '<div class="wa-tile"><span>Read rate</span><strong>' + (noDelivery ? "—" : waPct(t.readRate)) + '</strong><small>' + (noDelivery ? "no callbacks yet" : "read implies delivered") + '</small></div>' +
          '<div class="wa-tile"><span>Conversion</span><strong>' + waPct(t.conversionRate) + '</strong><small>reminders that led to payment</small></div>' +
          '<div class="wa-tile"><span>Proofs received</span><strong>' + num(t.proofs) + '</strong><small>payment screenshots</small></div>' +
          "</div>";
      }

      function waMonths(ms, noDelivery) {
        var max = Math.max.apply(null, ms.map(function (m) { return Number(m.remindersSent || 0); }).concat([1]));
        return '<div class="wa-months">' + ms.map(function (m) {
          var w = Math.max(4, Math.round((Number(m.remindersSent || 0) / max) * 100));
          return '<div class="wa-m' + (m.isMTD ? " mtd" : "") + '">' +
            '<h4>' + esc(m.label) + (m.isMTD ? '<span class="wa-mtd">MTD</span>' : "") + "</h4>" +
            '<div class="wa-big">' + num(m.remindersSent) + '<em>reminders</em></div>' +
            '<div class="wa-bar"><i style="width:' + w + '%"></i></div>' +
            '<div class="wa-kv"><span>Players reached</span><b>' + num(m.playersReached) + "</b></div>" +
            '<div class="wa-kv"><span>Delivered / read</span><b>' + (noDelivery ? "—" : waPct(m.deliveryRate) + " / " + waPct(m.readRate)) + "</b></div>" +
            '<div class="wa-kv"><span>Proofs</span><b>' + num(m.proofs) + "</b></div>" +
            '<div class="wa-kv"><span>Payments</span><b>' + num(m.paymentsViaReminder) + "</b></div>" +
            '<div class="wa-kv"><span>Revenue</span><b>' + waMoney(m.revenueViaReminder) + "</b></div>" +
            '<div class="wa-kv"><span>Conversion</span><b>' + waPct(m.conversionRate) + "</b></div>" +
            "</div>";
        }).join("") + "</div>";
      }

      function waTable(rows, noDelivery) {
        var cols = [["academyName", "Academy"], ["remindersSent", "Reminders"], ["playersReached", "Players"],
                    ["paymentsViaReminder", "Payments"], ["revenueViaReminder", "Revenue"],
                    ["deliveryRate", "Delivered"], ["readRate", "Read"], ["conversionRate", "Conversion"]];
        var sorted = rows.slice().sort(function (a, b) {
          if (wa.sort === "academyName") return String(a.academyName).localeCompare(String(b.academyName));
          return (Number(b[wa.sort] || 0) - Number(a[wa.sort] || 0));
        });
        return '<div class="wa-tablewrap"><div class="wa-scroll"><table class="wa-table"><thead><tr>' +
          cols.map(function (c) { return '<th data-wasort="' + c[0] + '" class="' + (wa.sort === c[0] ? "on" : "") + '">' + c[1] + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          sorted.map(function (a) {
            return '<tr data-tenant="' + esc(a.tenantId) + '">' +
              "<td>" + esc(a.academyName || a.tenantId) + "</td>" +
              "<td>" + num(a.remindersSent) + "</td>" +
              "<td>" + num(a.playersReached) + "</td>" +
              "<td>" + num(a.paymentsViaReminder) + "</td>" +
              "<td>" + waMoney(a.revenueViaReminder) + "</td>" +
              "<td>" + (noDelivery ? "—" : waPct(a.deliveryRate)) + "</td>" +
              "<td>" + (noDelivery ? "—" : waPct(a.readRate)) + "</td>" +
              "<td>" + waPct(a.conversionRate) + "</td></tr>";
          }).join("") + "</tbody></table></div></div>";
      }

      function waPopup() {
        if (!wa.open) return "";
        var body;
        if (wa.loading) {
          body = '<div class="wa-msg"><div class="wa-spin"></div><h4>Reading reminder history…</h4><p>Aggregating across academies.</p></div>';
        } else if (wa.error) {
          body = '<div class="wa-msg"><span class="mi">cloud_off</span><h4>Could not load statistics</h4><p>' + esc(wa.error) + '</p><button data-wa-retry>Try again</button></div>';
        } else if (!wa.data) {
          body = '<div class="wa-msg"><div class="wa-spin"></div></div>';
        } else {
          var t = wa.data.totals || {}, ms = wa.data.months || [], acc = wa.data.academies || [];
          var noDelivery = !t.hasDeliveryData;
          if (!Number(t.remindersSent)) {
            body = '<div class="wa-msg"><span class="mi">forum</span><h4>No reminders in this period</h4>' +
              '<p>Nothing was sent by ' + (wa.tenant === "all" ? "any academy" : "this academy") +
              ' in the last ' + wa.months + ' months. Reminders appear here as soon as the engine sends its first message.</p></div>';
          } else {
            body = waTiles(t) +
              '<div class="wa-sec"><h3>Month on month</h3><span>' + (wa.tenant === "all" ? "all academies combined" : "this academy") + ', current month marked MTD</span></div>' +
              waMonths(ms, noDelivery) +
              (wa.tenant === "all"
                ? '<div class="wa-sec"><h3>By academy</h3><span>tap a row for that academy’s detail · tap a heading to sort</span></div>' + waTable(acc, noDelivery)
                : "") +
              (noDelivery
                ? '<p class="wa-note"><b>Delivery and read rates are unavailable.</b> Both academies run WhatsApp in manual mode, so Meta has not sent delivery callbacks yet. These fill in automatically once the WABA is live — they are shown as “—” rather than 0% so an unmeasured rate is never read as a bad one.</p>'
                : "") +
              '<p class="wa-note">Counts deduplicate Meta callbacks on (academy + message id) and count each player once per academy per month. Payments count only when a reminder led to a confirmed payment; revenue is the confirmed amount. Months use each academy’s own timezone.</p>';
          }
        }
        var opts = '<option value="all"' + (wa.tenant === "all" ? " selected" : "") + ">All academies</option>" +
          state.data.map(function (a) { return '<option value="' + esc(a.id) + '"' + (wa.tenant === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>"; }).join("");
        var mopts = [3, 4, 6, 12].map(function (m) { return '<option value="' + m + '"' + (wa.months === m ? " selected" : "") + ">Last " + m + " months</option>"; }).join("");

        return '<div class="wa-back" data-wa-back><section class="wa-panel" role="dialog" aria-modal="true" aria-labelledby="waTitle">' +
          '<div class="wa-head"><div><div class="eyebrow">WhatsApp performance</div><h2 id="waTitle">Reminders to payments</h2>' +
          '<p>Deduplicated month-on-month results across academies.</p></div>' +
          '<button class="wa-x" data-wa-close aria-label="Close"><span class="mi">close</span></button></div>' +
          '<div class="wa-controls"><select data-wa-tenant aria-label="Academy">' + opts + "</select>" +
          '<select data-wa-months aria-label="Reporting period">' + mopts + "</select></div>" +
          '<div class="wa-body">' + body + "</div></section></div>";
      }

      /* ============ events (delegated; survive re-renders) ============ */
      document.addEventListener("click", function (e) {
        // ---- WhatsApp stats popup (before nav, so clicks inside it never fall through) ----
        if (e.target.closest("[data-wa-open]")) { waOpen(); return; }
        if (e.target.closest("[data-wa-close]")) { waClose(); return; }
        if (e.target.closest("[data-wa-retry]")) { waLoad(); return; }
        var waSort = e.target.closest("[data-wasort]");
        if (waSort) { wa.sort = waSort.getAttribute("data-wasort"); render(); return; }
        var waRow = e.target.closest("[data-tenant]");
        if (waRow && wa.open) { wa.tenant = waRow.getAttribute("data-tenant"); waLoad(); return; }
        if (e.target.hasAttribute && e.target.hasAttribute("data-wa-back")) { waClose(); return; }
        if (wa.open && e.target.closest(".wa-panel")) return;   // clicks inside the dialog do nothing else

        if (e.target.closest("[data-menu]")) { var app = document.querySelector(".app"); if (app) app.classList.toggle("nav-open"); return; }
        var nav = e.target.closest("[data-nav]");
        // ---- sales pipeline (before nav; the buttons live inside the table) ----
        /* One handler per verb, and every verb goes through salesDo ->
           sales_disposition. The old tab had data-swa, data-sopen, data-snext,
           data-sallsent, data-sdone, data-sundo, data-sact and data-sdnc: eight
           entry points, five write shapes, and not one of them scheduled a
           next step. */
        var smsg = e.target.closest("[data-smsg]");
        if (smsg) { salesMessage(smsg.getAttribute("data-smsg")); return; }

        // The Call button is a real <a href="tel:"> so the OS handles it. We
        // only record the attempt; the operator says what happened after.
        var sdo = e.target.closest("[data-sdo]");
        if (sdo) {
          var a = sdo.getAttribute("data-sdo").split("|");
          var id = a[0], what = a[1], arg = a[2];
          var when = null, note = null;

          if (what === "later") {
            // arg is a day offset. Compute the date here so the button can
            // stay a plain 1w/1m/3m, and let the database refuse anything
            // that is not actually in the future.
            var d = new Date();
            d.setDate(d.getDate() + (parseInt(arg, 10) || 7));
            when = d.toISOString().slice(0, 10);
          } else if (what === "booked") {
            var ans = window.prompt(
              "What date is the call booked for? (YYYY-MM-DD)",
              new Date(Date.now() + 864e5).toISOString().slice(0, 10));
            if (!ans) return;
            when = ans.trim();
          } else if (what === "not_interested") {
            // Ask WHY. A stage count cannot tell you whether you are losing on
            // price or to a rival, and those need different responses.
            note = window.prompt("Why? (price, uses a rival app, too small, " +
                                 "wrong person, no interest…)", "");
            if (note === null) return;
          } else if (what === "stop") {
            if (!window.confirm("Mark do-not-contact?\n\nThis suppresses every " +
                  "lead reachable on any of this academy's numbers, and a " +
                  "future re-import will not bring them back.\n\nFor a number " +
                  "with no WhatsApp use “No WhatsApp” instead — that " +
                  "keeps the academy as a prospect.")) return;
          } else if (what === "gatekeeper") {
            note = window.prompt("Who should you ask for next time? (optional)", "");
            if (note === null) return;
            note = "gatekeeper" + (note ? " — ask for " + note : "");
          }
          salesDo(id, what, when, note);
          return;
        }
        var sf = e.target.closest("[data-sf]");
        if (sf) {
          var k = sf.getAttribute("data-sf"), v = sf.getAttribute("data-sv");
          if (k === "callable") state.sales.f.callable = !state.sales.f.callable;
          else state.sales.f[k] = (state.sales.f[k] === v) ? "" : v;
          state.sales.loaded = false; loadSales(); return;
        }

        if (nav) {
          accessLeave(); state.view = nav.getAttribute("data-nav"); state.sel = null;
          if (state.view === "sales" && !state.sales.loaded) loadSales();
          render(); scrollTop(); return;
        }
        var open = e.target.closest("[data-open]");
        if (open) {
          accessLeave();
          state.sel = open.getAttribute("data-open");
          /* Re-entering an academy re-reads it. This is the habit the
             operator already had — clicking in and out to check for
             updates — and it used to show the cache every time. */
          loadEvents(state.sel, true);
          if (state.visitors) state.visitors = null;
          render(); scrollTop(); return;
        }
        if (e.target.closest("[data-back]")) { accessLeave(); state.sel = null; render(); scrollTop(); return; }
        var sort = e.target.closest("[data-sort]");
        if (sort) { var k = sort.getAttribute("data-sort"); if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc"; else { state.sortKey = k; state.sortDir = k === "name" ? "asc" : "desc"; } render(); return; }
        if (e.target.closest("[data-my-link]")) {
          /* No email is sent. The function reads the caller's own address
             from the auth server — passing one would make this a button
             that mints a reset link for any account on the platform. */
          /* reset.html, NOT the console itself. The link used to redirect
             back here, and nothing here understands a recovery token — so
             clicking it landed on the dashboard and did nothing at all. */
          fn("my_link", { redirectTo: location.href.replace(/[^/]*$/, "") + "reset.html" })
            .then(function (j) { state.myLink = (j && j.setup_link) || ""; render(); })
            .catch(function (err) { alert(err.message || "Could not create a reset link."); });
          return;
        }
        if (e.target.closest("[data-my-copy]")) {
          var box = document.getElementById("myLink");
          var btn = e.target.closest("[data-my-copy]");
          var done = function (ok) { btn.innerHTML = ok ? "Copied" : "Select it and copy"; };
          if (navigator.clipboard && state.myLink) {
            navigator.clipboard.writeText(state.myLink).then(function () { done(true); }, function () { done(false); });
          } else if (box) {
            var r = document.createRange(); r.selectNodeContents(box);
            var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done(false);
          }
          return;
        }
        if (e.target.closest("[data-my-dismiss]")) { state.myLink = ""; render(); return; }
        if (e.target.closest("[data-signout]")) { state.myLink = ""; localStorage.removeItem("am-session"); location.reload(); return; }
        if (e.target.closest("[data-issues]")) {
          /* Take the operator to where the errors can actually be acted
             on. One academy affected is the common case, so go straight
             into it rather than making them find it in the list. */
          var errs = (state.health && state.health.client_errors_24h) || [];
          var tenants = [];
          errs.forEach(function (x) { if (tenants.indexOf(x.tenant_id) < 0) tenants.push(x.tenant_id); });
          state.view = "academies";
          accessLeave(); state.sel = tenants.length === 1 ? tenants[0] : null;
          render(); scrollTop(); return;
        }
        var setsub = e.target.closest("[data-setsub]");
        if (setsub) {
          var st = (document.getElementById("subStatus") || {}).value;
          var mrrEl = document.getElementById("subMrr");
          var mrr = mrrEl && mrrEl.value !== "" ? Number(mrrEl.value) : null;
          setsub.disabled = true;
          setsub.textContent = "Saving…";
          rpc("set_subscription", {
            p_tenant: setsub.getAttribute("data-setsub"),
            p_status: st,
            p_mrr: mrr,
          }).then(function (r) {
            if (!r || !r.ok) {
              setsub.disabled = false;
              setsub.textContent = "Could not save";
              return;
            }
            // Re-read the portfolio rather than patching the row: the
            // server may have moved the renewal date, and guessing what
            // it did is how the screen and the database drift apart.
            rpc("operator_portfolio").then(function (rows) {
              if (rows) state.data = rows.map(mapAccount).sort(function (x, y) { return y.gmv - x.gmv; });
              render();
            });
          });
          return;
        }
        /* ---- People & access ---- */
        /* CLICK, not change. These two were written next to the role
           <select>'s handler and so ended up in the `change` listener — and
           a <button> never fires change, so Use and Dismiss did nothing at
           all. Buttons belong here. */
        var reqUse = e.target.closest("[data-req-use]");
        if (reqUse) {
          var rid = reqUse.getAttribute("data-req-use");
          var req = (access.reqs || []).filter(function (x) { return String(x.id) === rid; })[0];
          if (req) {
            /* Fill the form and set the role, then let the operator finish.
               A coach still needs centres picked, and picking those is the
               step that decides what they can see. */
            access.form.name = req.name || "";
            access.form.email = req.email || "";
            access.role = req.role === "coach" ? "coach" : "staff";
            access.usedReq = req.id;
            render();
            var em = document.getElementById("accEmail");
            if (em) { try { em.scrollIntoView({ block: "center" }); em.focus(); } catch (er) {} }
          }
          return;
        }

        var reqDrop = e.target.closest("[data-req-dismiss]");
        if (reqDrop) {
          var did = reqDrop.getAttribute("data-req-dismiss");
          reqDrop.disabled = true;
          /* rpc() swallows every failure and resolves with null, so a
             .catch() here would never run and a refusal would look exactly
             like a success — the row would vanish from the screen and stay
             pending in the database. Check the RESULT instead. */
          rpc("review_staff_request", {
            p_tenant: access.tenant, p_id: Number(did), p_status: "declined", p_by: "operator"
          }).then(function (res) {
            if (!res || res.ok !== true) {
              reqDrop.disabled = false;
              access.msg = "Could not dismiss that request — try again, or sign in afresh.";
              render();
              return;
            }
            access.reqs = (access.reqs || []).filter(function (x) { return String(x.id) !== did; });
            render();
          });
          return;
        }

        var accBtn = e.target.closest("[data-acc]");
        if (accBtn) { accessDo(accBtn.getAttribute("data-acc"), accBtn.getAttribute("data-acc-email")); return; }
        var accCopy = e.target.closest("[data-acc-copy]");
        if (accCopy) { accessCopy(accCopy); return; }
        if (e.target.closest("[data-acc-dismiss]")) { access.link = ""; access.linkFor = ""; access.linkKind = ""; render(); return; }
        if (e.target.closest("[data-acc-create]")) { accessCreate(); return; }

        var mine = e.target.closest("[data-mine]");
        if (mine) {
          e.stopPropagation();                       // do not also open the row
          var on = mine.dataset.mineOn === "1";
          mine.disabled = true;
          rpc("mark_visitor", { p_tenant: state.sel, p_visitor: mine.dataset.mine, p_internal: on })
            .then(function () {
              state.visitors = null;                 // force a refetch on the next render
              render();
            });
          return;
        }
        if (e.target.closest("#appsGo")) {
          var pwEl = document.getElementById("appsPw");
          var pw = pwEl ? pwEl.value : "";
          if (!pw) { state.appsErr = "Type your password first."; return render(); }
          appsSignIn(pw);
          pw = null;                                   // do not keep it around
          return;
        }
        var moreDay = e.target.closest("[data-moreday]");
        if (moreDay) {
          var dk = moreDay.getAttribute("data-moreday");
          state.openDays[dk] = !state.openDays[dk];
          render();
          return;
        }
        if (e.target.closest("[data-refresh]")) {
          liveRefreshOpen();
          liveRefreshPortfolio();
          return;
        }
        var res = e.target.closest("[data-resolve]");
        if (res) {
          var iconOnly = res.classList.contains("act-resolve");
          res.disabled = true;
          res.innerHTML = iconOnly
            ? '<span class="mi">hourglass_empty</span>'
            : '<span class="mi">hourglass_empty</span>Resolving';
          rpc("resolve_client_error", {
            p_tenant: res.getAttribute("data-tenant"),
            p_msg: res.getAttribute("data-msg"),
            p_ver: res.getAttribute("data-ver")
          }).then(function (r) {
            if (!r || !r.ok) {
              // Leave it alone and say so. Silently re-rendering an
              // unchanged list would read as "resolved" when it was not.
              res.disabled = false;
              res.innerHTML = iconOnly
                ? '<span class="mi">error</span>'
                : '<span class="mi">error</span>Could not resolve';
              if (iconOnly) res.title = "Could not resolve";
              return;
            }
            if (iconOnly) {
              /* The activity feed is a record of what happened, and the
                 error did happen — clearing the row would be rewriting
                 history. Mark it handled instead; Insight and the errors
                 card are where it disappears from. */
              res.innerHTML = '<span class="mi">check_circle</span>';
              res.title = "Resolved";
              res.classList.add("act-resolve--done");
              refreshHealth();
              return;
            }
            refreshHealth();
          });
          return;
        }
      });
      /* the add-someone form. Both branches sync what has been typed
         BEFORE re-rendering, because render() rebuilds the inputs. */
      document.addEventListener("change", function (e) {
        var accRole = e.target.closest("[data-acc-role]");
        if (accRole) { accessSyncForm(); access.role = accRole.value === "coach" ? "coach" : "staff"; render(); return; }
        var accC = e.target.closest("[data-acc-centre]");
        if (accC) {
          accessSyncForm();
          var cid = Number(accC.getAttribute("data-acc-centre"));
          var at = access.form.centres.indexOf(cid);
          if (accC.checked && at < 0) access.form.centres.push(cid);
          else if (!accC.checked && at >= 0) access.form.centres.splice(at, 1);
          render(); return;
        }
      });
      document.addEventListener("input", function (e) {
        if (e.target.id === "accName" || e.target.id === "accEmail") accessSyncForm();
      });

      // the two popup selects
      document.addEventListener("change", function (e) {
        var t = e.target.closest("[data-wa-tenant]");
        if (t) { wa.tenant = t.value; waLoad(); return; }
        var m = e.target.closest("[data-wa-months]");
        if (m) { wa.months = Number(m.value) || 4; waLoad(); return; }
      });
      // Escape closes the dialog
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && wa.open) waClose();
      });

      function scrollTop() { var s = document.getElementById("amScroll"); if (s) s.scrollTop = 0; }

      /* Re-read health from the server rather than splicing the resolved
         row out of the local copy. The server is what decides whether an
         error is still open, and it has one rule that the client cannot
         reproduce: a newer occurrence outranks the acknowledgement. */
      function refreshHealth() {
        return rpc("platform_health").then(function (h) {
          if (h) { state.health = Object.assign({}, state.health, h); render(); }
        });
      }

      /* sales filters: the select applies at once, the search on Enter or
         blur. Re-rendering on every keystroke would refetch 400 rows per
         character over a 180 ms round-trip. */
      document.addEventListener("change", function (e) {
        if (e.target.id === "salesSport") {
          state.sales.f.sport = e.target.value;
          state.sales.loaded = false; loadSales();
        }
        /* The sender-number input went with the banner. The number is a
           property of the WhatsApp Business App the operator is typing in, not
           something the console should invite them to change mid-campaign —
           and sales_disposition() no longer records it per touch. It lives in
           marketing/leads/WHATSAPP-KIT.md §0. */
      });
      document.addEventListener("keydown", function (e) {
        if (e.target.id === "salesQ" && e.key === "Enter") {
          state.sales.f.q = e.target.value.trim();
          state.sales.loaded = false; loadSales();
        }
      });

      /* ============ boot ============ */
      render(); // shell first (empty), then hydrate
      // Nothing to fetch until someone is signed in. Firing these while the
      // gate is up just produced four 401s in the console on every visit.
      if (!s0) return;
      rpc("get_channels").then(function (list) {
        if (list && list.length) { list.forEach(function (c) { if (CH[c.id] == null && c.color) CH[c.id] = c.color; }); }
      }).then(function () {
        return Promise.all([rpc("operator_portfolio"), rpc("platform_health"), rpc("reconcile_report").catch(function () { return null; })]);
      }).then(function (r) {
        var rows = r[0] || [], h = r[1] || {}, rec = r[2] || {};
        state.data = rows.map(mapAccount).sort(function (a, b) { return b.gmv - a.gmv; });
        state.health = Object.assign({}, h, { gap_count: (rec && rec.gap_count) || 0 });
        state.loaded = true;
        LIVE.portfolioAt = Date.now();
        LIVE.at = Date.now();
        render();
        liveStart();
      });
    })();
  </script>
</body>
</html>
