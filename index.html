        var pct = a.prev ? Math.round((a.gmv - a.prev) / a.prev * 100) : 0, up = pct >= 0;
        var over = a.cap && a.players > a.cap, nearCap = a.cap && a.players >= a.cap * 0.9;
        var header = '<div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:22px"><div style="width:56px;height:56px;border-radius:15px;background:' + t[1] + ';display:flex;align-items:center;justify-content:center;flex:none"><span class="mi" style="font-size:30px;color:' + t[0] + '">' + a.icon + '</span></div><div style="min-width:0;flex:1"><div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap"><h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em">' + esc(a.name) + "</h2>" + pill(a.health, hs) + '</div><div style="font-size:13px;color:var(--tx3);margin-top:3px">' + esc(a.sub) + (a.owner ? " · Owner " + esc(a.owner) : "") +
          (a.federated ? ' · <span title="Runs on its own Supabase project and reports in. Figures come from its latest rollup, not from tables here.">own project</span>' : "") + "</div></div>" +
          (a.tenant ? '<a class="btn-g" href="' + esc(a.tenantUrl) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bd-btn);border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;flex:none;text-decoration:none">Open tenant console<span class="mi" style="font-size:17px">open_in_new</span></a>' : "") + "</div>";

        if (a.health === "Onboarding") {
          var check = [["Account created & subscription active", "check_circle", "#16a34a", "#4b5563"], ["Branded app configured", a.tenant ? "check_circle" : "pending", a.tenant ? "#16a34a" : "#d97706", "#4b5563"], ["Courts & batches being set up", "pending", "#d97706", "#4b5563"], ["First booking pending", "radio_button_unchecked", "#c7ccd4", "#9aa1ad"]].map(function (c) { return '<div style="display:flex;align-items:center;gap:11px"><span class="mi fill" style="font-size:20px;color:' + c[2] + '">' + c[1] + '</span><span style="font-size:13px;font-weight:500;color:' + c[3] + '">' + c[0] + "</span></div>"; }).join("");
          return header + '<div style="background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:48px 32px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.04)"><div style="width:60px;height:60px;border-radius:16px;background:var(--acs);display:flex;align-items:center;justify-content:center;margin:0 auto"><span class="mi" style="font-size:32px;color:var(--act)">rocket_launch</span></div><h3 style="font-size:17px;font-weight:700;margin-top:18px;letter-spacing:-0.01em">Onboarding in progress</h3><p style="font-size:13.5px;color:var(--tx3);max-width:400px;margin:8px auto 0;line-height:1.55">' + esc(a.name) + " hasn't processed any bookings yet. Metrics will appear here automatically once their app goes live.</p><div style=\"display:inline-flex;flex-direction:column;gap:11px;margin-top:26px;text-align:left\">" + check + '</div></div><div style="margin-top:20px">' + activityCard(a) + "</div>" + tenantErrorsCard(a);
        }

        function mini(label, value, sub, trend, trendColor) { return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04)"><div style="font-size:12px;color:var(--tx4);font-weight:500">' + label + '</div><div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-top:8px;font-variant-numeric:tabular-nums">' + value + (trend ? ' <span style="font-size:12.5px;font-weight:600;color:' + trendColor + '">' + trend + "</span>" : "") + '</div><div style="font-size:12px;color:var(--tx4);margin-top:2px">' + sub + "</div></div>"; }
        var kpis = mini("MRR", inr(a.mrr), a.plan + " plan") +
          mini("GMV · 30d", inrK(a.gmv), "vs prior month", a.prev ? (up ? "+" : "") + pct + "%" : "", up ? "#16a34a" : "#dc2626") +
          mini("Active players", a.players + "/" + a.cap, over ? "over cap" : nearCap ? "near cap" : (a.cap ? Math.round(a.players / a.cap * 100) + "% of cap" : "—")) +
          mini("Adoption", a.activeDays + "/30", "active days");

        var mixKeys = Object.keys(a.mix).sort(function (x, y) { return a.mix[y] - a.mix[x]; });
        var mixTot = mixKeys.reduce(function (s, k) { return s + a.mix[k]; }, 0) || 1;
        var mixLegend = mixKeys.map(function (k) { return '<span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2)"><span style="width:9px;height:9px;border-radius:3px;background:' + (CH[k] || "#b9b7ac") + '"></span>' + esc(k) + ' <b style="font-weight:600">' + Math.round(a.mix[k] / mixTot * 100) + "%</b></span>"; }).join("") || '<span style="font-size:12.5px;color:var(--tx4)">No channel bookings yet</span>';

        function facts(list) { return list.map(function (f) { return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd3)"><span style="font-size:12.5px;color:var(--tx3)">' + f[0] + '</span><span style="font-size:12.5px;font-weight:600;color:' + (f[2] || "#1a1d21") + ';text-align:right">' + f[1] + "</span></div>"; }).join(""); }
        var planFacts = facts([["Tier", esc(a.plan), ac], ["Subscription", inr(a.mrr) + " / mo"], ["Billing status", bs[2], bs[0]], ["Payment method", esc(a.method)], ["Next renewal", esc(a.renews), a.bill === "overdue" ? "#dc2626" : "#1a1d21"], ["Messaging · 30d", num(a.msgs) + " · " + inr(a.msgCost)]]);
        var adoptFacts = facts([["Active days", a.activeDays + " / 30"], ["Sessions · 30d", num(a.sessions)], ["Last activity", agoH(a.lastH)], ["App build", a.ver === "—" ? "—" : "v" + a.ver], ["Errors · 30d", String(a.errors), a.errors ? "#dc2626" : "#16a34a"]]);
        var bookFacts = facts([["Bookings · all time", num(a.totalBk)], ["Weekday / weekend", num(a.wkday) + " / " + num(a.wkend)], ["Court revenue · 90d", inr(a.courtRev)], ["Unique bookers", num(a.bookers)]]);

        /* Moving an academy from trial to paying used to mean opening a
           SQL editor against production. The console read subscriptions
           and could not write them, which is a poor reason to be typing
           `update ... where` by hand on a live database. */
        function billingControl(a) {
          var statuses = ["trial", "active", "overdue", "pilot", "cancelled"];
          return '<div class="billing-edit">' +
            '<div class="billing-edit__label">Change billing</div>' +
            '<div class="billing-edit__row">' +
              '<select id="subStatus">' +
                statuses.map(function (st) {
                  return '<option value="' + st + '"' + (st === (a.subStatus || "") ? " selected" : "") + ">" + st + "</option>";
                }).join("") +
              "</select>" +
              '<span class="billing-edit__money"><input id="subMrr" type="number" min="0" step="1" ' +
                'aria-label="Monthly amount" value="' + Number(a.mrr || 0) + '" /></span>' +
            "</div>" +
            '<button class="billing-edit__save" data-setsub="' + esc(a.id) + '">Save</button>' +
            '<div class="billing-edit__hint">' +
              "<b>active</b> shows as Paid. A renewal already past reads Overdue whatever the status, so marking someone paid moves it on a month." +
            "</div></div>";
        }

        function card(title, meta, inner) { return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04)"><div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:14px;font-weight:700;letter-spacing:-0.01em">' + title + "</h3>" + (meta ? '<span style="font-size:12px;color:var(--tx4)">' + meta + "</span>" : "") + "</div>" + inner + "</div>"; }
        return header +
          '<div class="kpis" style="margin-bottom:20px">' + kpis + "</div>" +
          '<div class="dgrid"><div style="display:flex;flex-direction:column;gap:20px">' +
            card("Gross volume", "weekly · last 8 weeks", '<div style="margin-top:18px">' + bars(a.weekly, 92, 8) + '</div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--tx5)"><span>8 wks ago</span><span>this week</span></div>') +
            card("Booking channels · 30d", "", '<div style="margin-top:18px">' + mixBar(a.mix, 12) + '</div><div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px">' + mixLegend + "</div>") +
            activityCard(a) +
          "</div><div style=\"display:flex;flex-direction:column;gap:20px\">" +
            card("Plan &amp; billing", "", '<div style="margin-top:6px">' + planFacts + "</div>" + billingControl(a)) +
            card("Adoption · 30d", "", '<div style="margin-top:6px">' + adoptFacts + "</div>") +
            card("Court bookings", "", '<div style="margin-top:6px">' + bookFacts + "</div>") +
          "</div></div>" + tenantErrorsCard(a);
      }

      /* ============ WhatsApp reminder performance ============
         One RPC returns the whole dashboard already aggregated, so no
         raw event ever reaches this browser — which is both the privacy
         position (parents' numbers stay in the database) and the reason
         it stays fast at >1000 events. */
      var wa = { open: false, tenant: "all", months: 4, sort: "remindersSent", data: null, loading: false, error: null };

      function waLoad() {
        wa.loading = true; wa.error = null; render();
        rpc("whatsapp_reminder_stats", { p_tenant: wa.tenant, p_months: wa.months })
          .then(function (r) {
            wa.loading = false;
            if (!r || r.success !== true) { wa.error = "The statistics service did not answer."; }
            else { wa.data = r; }
            render();
          })
          .catch(function () { wa.loading = false; wa.error = "Could not reach the statistics service."; render(); });
      }
      function waOpen() { wa.open = true; wa.tenant = "all"; wa.data = null; waLoad(); }
      function waClose() { wa.open = false; wa.data = null; wa.error = null; render(); }

      function waPct(v) { return v == null ? "—" : v + "%"; }
      function waMoney(n) { return inrK(Number(n || 0)); }

      function waTiles(t) {
        var noDelivery = !t.hasDeliveryData;
        return '<div class="wa-tiles">' +
          '<div class="wa-tile"><span>Reminders sent</span><strong>' + num(t.remindersSent) + '</strong><small>' + num(t.uniquePlayers) + ' unique players</small></div>' +
          '<div class="wa-tile"><span>Academies using</span><strong>' + num(t.academiesUsing) + '</strong><small>with at least one reminder</small></div>' +
          '<div class="wa-tile"><span>Payments via reminder</span><strong>' + num(t.paymentsViaReminder) + '</strong><small>' + num(t.proofs) + ' proofs received</small></div>' +
          '<div class="wa-tile"><span>Revenue via reminder</span><strong>' + waMoney(t.revenueViaReminder) + '</strong><small>confirmed payments only</small></div>' +
          '<div class="wa-tile"><span>Delivery rate</span><strong>' + (noDelivery ? "—" : waPct(t.deliveryRate)) + '</strong><small>' + (noDelivery ? "no callbacks yet" : "of reminders sent") + '</small></div>' +
          '<div class="wa-tile"><span>Read rate</span><strong>' + (noDelivery ? "—" : waPct(t.readRate)) + '</strong><small>' + (noDelivery ? "no callbacks yet" : "read implies delivered") + '</small></div>' +
          '<div class="wa-tile"><span>Conversion</span><strong>' + waPct(t.conversionRate) + '</strong><small>reminders that led to payment</small></div>' +
          '<div class="wa-tile"><span>Proofs received</span><strong>' + num(t.proofs) + '</strong><small>payment screenshots</small></div>' +
          "</div>";
      }

      function waMonths(ms, noDelivery) {
        var max = Math.max.apply(null, ms.map(function (m) { return Number(m.remindersSent || 0); }).concat([1]));
        return '<div class="wa-months">' + ms.map(function (m) {
          var w = Math.max(4, Math.round((Number(m.remindersSent || 0) / max) * 100));
          return '<div class="wa-m' + (m.isMTD ? " mtd" : "") + '">' +
            '<h4>' + esc(m.label) + (m.isMTD ? '<span class="wa-mtd">MTD</span>' : "") + "</h4>" +
            '<div class="wa-big">' + num(m.remindersSent) + '<em>reminders</em></div>' +
            '<div class="wa-bar"><i style="width:' + w + '%"></i></div>' +
            '<div class="wa-kv"><span>Players reached</span><b>' + num(m.playersReached) + "</b></div>" +
            '<div class="wa-kv"><span>Delivered / read</span><b>' + (noDelivery ? "—" : waPct(m.deliveryRate) + " / " + waPct(m.readRate)) + "</b></div>" +
            '<div class="wa-kv"><span>Proofs</span><b>' + num(m.proofs) + "</b></div>" +
            '<div class="wa-kv"><span>Payments</span><b>' + num(m.paymentsViaReminder) + "</b></div>" +
            '<div class="wa-kv"><span>Revenue</span><b>' + waMoney(m.revenueViaReminder) + "</b></div>" +
            '<div class="wa-kv"><span>Conversion</span><b>' + waPct(m.conversionRate) + "</b></div>" +
            "</div>";
        }).join("") + "</div>";
      }

      function waTable(rows, noDelivery) {
        var cols = [["academyName", "Academy"], ["remindersSent", "Reminders"], ["playersReached", "Players"],
                    ["paymentsViaReminder", "Payments"], ["revenueViaReminder", "Revenue"],
                    ["deliveryRate", "Delivered"], ["readRate", "Read"], ["conversionRate", "Conversion"]];
        var sorted = rows.slice().sort(function (a, b) {
          if (wa.sort === "academyName") return String(a.academyName).localeCompare(String(b.academyName));
          return (Number(b[wa.sort] || 0) - Number(a[wa.sort] || 0));
        });
        return '<div class="wa-tablewrap"><div class="wa-scroll"><table class="wa-table"><thead><tr>' +
          cols.map(function (c) { return '<th data-wasort="' + c[0] + '" class="' + (wa.sort === c[0] ? "on" : "") + '">' + c[1] + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          sorted.map(function (a) {
            return '<tr data-tenant="' + esc(a.tenantId) + '">' +
              "<td>" + esc(a.academyName || a.tenantId) + "</td>" +
              "<td>" + num(a.remindersSent) + "</td>" +
              "<td>" + num(a.playersReached) + "</td>" +
              "<td>" + num(a.paymentsViaReminder) + "</td>" +
              "<td>" + waMoney(a.revenueViaReminder) + "</td>" +
              "<td>" + (noDelivery ? "—" : waPct(a.deliveryRate)) + "</td>" +
              "<td>" + (noDelivery ? "—" : waPct(a.readRate)) + "</td>" +
              "<td>" + waPct(a.conversionRate) + "</td></tr>";
          }).join("") + "</tbody></table></div></div>";
      }

      function waPopup() {
        if (!wa.open) return "";
        var body;
        if (wa.loading) {
          body = '<div class="wa-msg"><div class="wa-spin"></div><h4>Reading reminder history…</h4><p>Aggregating across academies.</p></div>';
        } else if (wa.error) {
          body = '<div class="wa-msg"><span class="mi">cloud_off</span><h4>Could not load statistics</h4><p>' + esc(wa.error) + '</p><button data-wa-retry>Try again</button></div>';
        } else if (!wa.data) {
          body = '<div class="wa-msg"><div class="wa-spin"></div></div>';
        } else {
          var t = wa.data.totals || {}, ms = wa.data.months || [], acc = wa.data.academies || [];
          var noDelivery = !t.hasDeliveryData;
          if (!Number(t.remindersSent)) {
            body = '<div class="wa-msg"><span class="mi">forum</span><h4>No reminders in this period</h4>' +
              '<p>Nothing was sent by ' + (wa.tenant === "all" ? "any academy" : "this academy") +
              ' in the last ' + wa.months + ' months. Reminders appear here as soon as the engine sends its first message.</p></div>';
          } else {
            body = waTiles(t) +
              '<div class="wa-sec"><h3>Month on month</h3><span>' + (wa.tenant === "all" ? "all academies combined" : "this academy") + ', current month marked MTD</span></div>' +
              waMonths(ms, noDelivery) +
              (wa.tenant === "all"
                ? '<div class="wa-sec"><h3>By academy</h3><span>tap a row for that academy’s detail · tap a heading to sort</span></div>' + waTable(acc, noDelivery)
                : "") +
              (noDelivery
                ? '<p class="wa-note"><b>Delivery and read rates are unavailable.</b> Both academies run WhatsApp in manual mode, so Meta has not sent delivery callbacks yet. These fill in automatically once the WABA is live — they are shown as “—” rather than 0% so an unmeasured rate is never read as a bad one.</p>'
                : "") +
              '<p class="wa-note">Counts deduplicate Meta callbacks on (academy + message id) and count each player once per academy per month. Payments count only when a reminder led to a confirmed payment; revenue is the confirmed amount. Months use each academy’s own timezone.</p>';
          }
        }
        var opts = '<option value="all"' + (wa.tenant === "all" ? " selected" : "") + ">All academies</option>" +
          state.data.map(function (a) { return '<option value="' + esc(a.id) + '"' + (wa.tenant === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>"; }).join("");
        var mopts = [3, 4, 6, 12].map(function (m) { return '<option value="' + m + '"' + (wa.months === m ? " selected" : "") + ">Last " + m + " months</option>"; }).join("");

        return '<div class="wa-back" data-wa-back><section class="wa-panel" role="dialog" aria-modal="true" aria-labelledby="waTitle">' +
          '<div class="wa-head"><div><div class="eyebrow">WhatsApp performance</div><h2 id="waTitle">Reminders to payments</h2>' +
          '<p>Deduplicated month-on-month results across academies.</p></div>' +
          '<button class="wa-x" data-wa-close aria-label="Close"><span class="mi">close</span></button></div>' +
          '<div class="wa-controls"><select data-wa-tenant aria-label="Academy">' + opts + "</select>" +
          '<select data-wa-months aria-label="Reporting period">' + mopts + "</select></div>" +
          '<div class="wa-body">' + body + "</div></section></div>";
      }

      /* ============ events (delegated; survive re-renders) ============ */
      document.addEventListener("click", function (e) {
        // ---- WhatsApp stats popup (before nav, so clicks inside it never fall through) ----
        if (e.target.closest("[data-wa-open]")) { waOpen(); return; }
        if (e.target.closest("[data-wa-close]")) { waClose(); return; }
        if (e.target.closest("[data-wa-retry]")) { waLoad(); return; }
        var waSort = e.target.closest("[data-wasort]");
        if (waSort) { wa.sort = waSort.getAttribute("data-wasort"); render(); return; }
        var waRow = e.target.closest("[data-tenant]");
        if (waRow && wa.open) { wa.tenant = waRow.getAttribute("data-tenant"); waLoad(); return; }
        if (e.target.hasAttribute && e.target.hasAttribute("data-wa-back")) { waClose(); return; }
        if (wa.open && e.target.closest(".wa-panel")) return;   // clicks inside the dialog do nothing else

        if (e.target.closest("[data-menu]")) { var app = document.querySelector(".app"); if (app) app.classList.toggle("nav-open"); return; }
        var nav = e.target.closest("[data-nav]");
        // ---- sales pipeline (before nav; the buttons live inside the table) ----
        var swa = e.target.closest("[data-swa]");
        if (swa) {
          var lid = swa.getAttribute("data-swa");
          var lead = state.sales.leads.filter(function (x) { return x.id === lid; })[0];
          if (lead && lead.wa_link) {
            // open the chat with the opener pre-filled, then log it. wa.me
            // carries text only — the flyer is attached by hand.
            window.open(lead.wa_link + "?text=" + encodeURIComponent(salesMsg(lead)),
                        "_blank", "noopener");
            /* Log 'opened', NOT 'sent'. Pressing this button opens a draft;
               the caller still has to press send inside WhatsApp, and may
               read it and close it. Recording a draft as a send marked
               prospects contacted who had never been messaged, and put
               drafts in the A/B denominator. The row now asks. */
            if (!state.sales.drafted) state.sales.drafted = {};
            state.sales.drafted[lid] = true;
            // arm B: put the image on the clipboard so the paste is one key
            var armCopied = false;
            if ((SALES_AB[lead.variant] || {}).shot) armCopied = salesCopyImage();
            if ((SALES_AB[lead.variant] || {}).shot && !armCopied) {
              window.setTimeout(function () {
                window.alert("Could not copy the image to the clipboard.\n\n" +
                  "Attach marketing/leads/dashboard-dues-whatsapp.jpg by hand in " +
                  "the chat before sending.");
              }, 50);
            }
            rpc("sales_log_touch", {
              p_lead: lid, p_channel: "whatsapp", p_outcome: "opened",
              p_direction: "out", p_template: "opener_" + lead.variant,
              p_body: salesMsg(lead), p_sent_from: state.sales.from,
              p_variant: lead.variant
            }).then(function () { state.sales.loaded = false; loadSales(); });
          }
          return;
        }
        var sbatch = e.target.closest("[data-sbatch]");
        if (sbatch && !sbatch.disabled) { salesBatch(sbatch.getAttribute("data-sbatch")); return; }
        var sallsent = e.target.closest("[data-sallsent]");
        if (sallsent) { salesConfirmAll(sallsent.getAttribute("data-sallsent")); return; }
        var sdone = e.target.closest("[data-sdone]");
        if (sdone) {
          var did = sdone.getAttribute("data-sdone");
          if (state.sales.drafted) delete state.sales.drafted[did];
          salesAct(did, "whatsapp", "sent", "out");
          return;
        }
        var sundo = e.target.closest("[data-sundo]");
        if (sundo) {
          // they looked and did not send: keep the 'opened' record, drop the prompt
          if (state.sales.drafted) delete state.sales.drafted[sundo.getAttribute("data-sundo")];
          render();
          return;
        }
        var sact = e.target.closest("[data-sact]");
        if (sact) {
          var a = sact.getAttribute("data-sact").split("|");
          salesAct(a[0], a[1], a[2], a[3]);
          return;
        }
        var sdnc = e.target.closest("[data-sdnc]");
        if (sdnc) {
          // irreversible by design: it writes every one of the lead's numbers
          // to the do-not-contact list, which a re-import cannot undo.
          if (window.confirm("Mark do-not-contact?\n\nThis suppresses every lead reachable on any of this academy's numbers, and a future re-import will not bring them back.")) {
            rpc("sales_set_dnc", { p_lead: sdnc.getAttribute("data-sdnc"), p_reason: "asked us to stop" })
              .then(function () { state.sales.loaded = false; loadSales(); });
          }
          return;
        }
        var sf = e.target.closest("[data-sf]");
        if (sf) {
          var k = sf.getAttribute("data-sf"), v = sf.getAttribute("data-sv");
          if (k === "callable") state.sales.f.callable = !state.sales.f.callable;
          else state.sales.f[k] = (state.sales.f[k] === v) ? "" : v;
          state.sales.loaded = false; loadSales(); return;
        }

        if (nav) {
          state.view = nav.getAttribute("data-nav"); state.sel = null;
          if (state.view === "sales" && !state.sales.loaded) loadSales();
          render(); scrollTop(); return;
        }
        var open = e.target.closest("[data-open]");
        if (open) { state.sel = open.getAttribute("data-open"); render(); scrollTop(); return; }
        if (e.target.closest("[data-back]")) { state.sel = null; render(); scrollTop(); return; }
        var sort = e.target.closest("[data-sort]");
        if (sort) { var k = sort.getAttribute("data-sort"); if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc"; else { state.sortKey = k; state.sortDir = k === "name" ? "asc" : "desc"; } render(); return; }
        if (e.target.closest("[data-signout]")) { localStorage.removeItem("am-session"); location.reload(); return; }
        if (e.target.closest("[data-issues]")) {
          /* Take the operator to where the errors can actually be acted
             on. One academy affected is the common case, so go straight
             into it rather than making them find it in the list. */
          var errs = (state.health && state.health.client_errors_24h) || [];
          var tenants = [];
          errs.forEach(function (x) { if (tenants.indexOf(x.tenant_id) < 0) tenants.push(x.tenant_id); });
          state.view = "academies";
          state.sel = tenants.length === 1 ? tenants[0] : null;
          render(); scrollTop(); return;
        }
        var setsub = e.target.closest("[data-setsub]");
        if (setsub) {
          var st = (document.getElementById("subStatus") || {}).value;
          var mrrEl = document.getElementById("subMrr");
          var mrr = mrrEl && mrrEl.value !== "" ? Number(mrrEl.value) : null;
          setsub.disabled = true;
          setsub.textContent = "Saving…";
          rpc("set_subscription", {
            p_tenant: setsub.getAttribute("data-setsub"),
            p_status: st,
            p_mrr: mrr,
          }).then(function (r) {
            if (!r || !r.ok) {
              setsub.disabled = false;
              setsub.textContent = "Could not save";
              return;
            }
            // Re-read the portfolio rather than patching the row: the
            // server may have moved the renewal date, and guessing what
            // it did is how the screen and the database drift apart.
            rpc("operator_portfolio").then(function (rows) {
              if (rows) state.data = rows.map(mapAccount).sort(function (x, y) { return y.gmv - x.gmv; });
              render();
            });
          });
          return;
        }
        var res = e.target.closest("[data-resolve]");
        if (res) {
          var iconOnly = res.classList.contains("act-resolve");
          res.disabled = true;
          res.innerHTML = iconOnly
            ? '<span class="mi">hourglass_empty</span>'
            : '<span class="mi">hourglass_empty</span>Resolving';
          rpc("resolve_client_error", {
            p_tenant: res.getAttribute("data-tenant"),
            p_msg: res.getAttribute("data-msg"),
            p_ver: res.getAttribute("data-ver")
          }).then(function (r) {
            if (!r || !r.ok) {
              // Leave it alone and say so. Silently re-rendering an
              // unchanged list would read as "resolved" when it was not.
              res.disabled = false;
              res.innerHTML = iconOnly
                ? '<span class="mi">error</span>'
                : '<span class="mi">error</span>Could not resolve';
              if (iconOnly) res.title = "Could not resolve";
              return;
            }
            if (iconOnly) {
              /* The activity feed is a record of what happened, and the
                 error did happen — clearing the row would be rewriting
                 history. Mark it handled instead; Insight and the errors
                 card are where it disappears from. */
              res.innerHTML = '<span class="mi">check_circle</span>';
              res.title = "Resolved";
              res.classList.add("act-resolve--done");
              refreshHealth();
              return;
            }
            refreshHealth();
          });
          return;
        }
      });
      // the two popup selects
      document.addEventListener("change", function (e) {
        var t = e.target.closest("[data-wa-tenant]");
        if (t) { wa.tenant = t.value; waLoad(); return; }
        var m = e.target.closest("[data-wa-months]");
        if (m) { wa.months = Number(m.value) || 4; waLoad(); return; }
      });
      // Escape closes the dialog
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && wa.open) waClose();
      });

      function scrollTop() { var s = document.getElementById("amScroll"); if (s) s.scrollTop = 0; }

      /* Re-read health from the server rather than splicing the resolved
         row out of the local copy. The server is what decides whether an
         error is still open, and it has one rule that the client cannot
         reproduce: a newer occurrence outranks the acknowledgement. */
      function refreshHealth() {
        return rpc("platform_health").then(function (h) {
          if (h) { state.health = Object.assign({}, state.health, h); render(); }
        });
      }

      /* sales filters: the select applies at once, the search on Enter or
         blur. Re-rendering on every keystroke would refetch 400 rows per
         character over a 180 ms round-trip. */
      document.addEventListener("change", function (e) {
        if (e.target.id === "salesSport") {
          state.sales.f.sport = e.target.value;
          state.sales.loaded = false; loadSales();
        }
        if (e.target.id === "salesFrom") {
          // recorded on every touch, so a restricted sender is traceable
          state.sales.from = e.target.value.replace(/\D/g, "") || state.sales.from;
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.target.id === "salesQ" && e.key === "Enter") {
          state.sales.f.q = e.target.value.trim();
          state.sales.loaded = false; loadSales();
        }
      });

      /* ============ boot ============ */
      render(); // shell first (empty), then hydrate
      // Nothing to fetch until someone is signed in. Firing these while the
      // gate is up just produced four 401s in the console on every visit.
      if (!s0) return;
      rpc("get_channels").then(function (list) {
        if (list && list.length) { list.forEach(function (c) { if (CH[c.id] == null && c.color) CH[c.id] = c.color; }); }
      }).then(function () {
        return Promise.all([rpc("operator_portfolio"), rpc("platform_health"), rpc("reconcile_report").catch(function () { return null; })]);
      }).then(function (r) {
        var rows = r[0] || [], h = r[1] || {}, rec = r[2] || {};
        state.data = rows.map(mapAccount).sort(function (a, b) { return b.gmv - a.gmv; });
        state.health = Object.assign({}, h, { gap_count: (rec && rec.gap_count) || 0 });
        state.loaded = true;
        render();
      });
    })();
  </script>
</body>
</html>
