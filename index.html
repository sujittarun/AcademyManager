<!DOCTYPE html>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3ed" />

<body>
  <!-- operator sign-in.
       NEVER put value= on these two inputs. This file has been served
       from GitHub Pages, so a value here is a live operator credential
       on the open web — and it stays in git history after removal.
       On 2026-08-05 exactly that happened: the operator password was
       public on both this console and CourtSync. -->
  <div class="gate" id="gate">
    <form class="gate-card" id="gateForm">
      <img src="assets/branding/logo-full.jpg" alt="Academy Manager — Sports · Operations · Insight" style="width:250px;display:block;margin:0 auto 2px;border-radius:14px" />
      <p>Operator console. Account-level metrics only — member data stays inside each academy.</p>
      <label><span>Email</span><input type="email" name="email" required  placeholder="you@academymanager.in" /></label>
      <label><span>Password</span><input type="password" name="password" required  placeholder="••••••••" /></label>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      "use strict";

      /* ============ platform DB (anon key; RLS-gated) ============ */
      var PROJECT = "https://ugsklcipzyiogxynshnh.supabase.co";
      var BASE = PROJECT + "/rest/v1";
      var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnc2tsY2lwenlpb2d4eW5zaG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUyMzksImV4cCI6MjA5ODQ3MTIzOX0.w7xkjdTkYN2qA0oxMKLUNtua0ScKVHKQzfEyIayh9eo";
      var COURTSYNC_URL = "https://sujittarun.github.io/CourtSync/";

      function amSession() { try { return JSON.parse(localStorage.getItem("am-session")); } catch (e) { return null; } }
      function bearerTok() {
        var s = amSession();
        if (!s || !s.access_token) return Promise.resolve(KEY);
        if (s.expires_at - Date.now() > 90 * 1000) return Promise.resolve(s.access_token);
        return fetch(PROJECT + "/auth/v1/token?grant_type=refresh_token", {
          method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: s.refresh_token }),
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j.access_token) throw new Error("expired");
          s.access_token = j.access_token; s.refresh_token = j.refresh_token;
          s.expires_at = Date.now() + (j.expires_in || 3600) * 1000;
          localStorage.setItem("am-session", JSON.stringify(s));
          return s.access_token;
        }).catch(function () { localStorage.removeItem("am-session"); return KEY; });
      }
      function get(path) {
        return bearerTok().then(function (tok) { return fetch(BASE + path, { headers: { apikey: KEY, Authorization: "Bearer " + tok } }); })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(function () { return []; });
      }
      function rpc(name, args) {
        return bearerTok().then(function (tok) {
          return fetch(BASE + "/rpc/" + name, { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify(args || {}) });
        }).then(function (r) {
          // 401/403 must not be swallowed. Every caller does `|| []`, so a
          // silent null renders an empty console — no academies, no error,
          // no hint that the session is the problem. Send the operator back
          // to the gate instead of showing them a blank dashboard.
          if (r.status === 401 || r.status === 403) { signOutToGate("Session expired — please sign in again."); throw new Error(r.status); }
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }).catch(function () { return null; });
      }


      /* ============ the access-admin edge function ============
         Creating a login needs the Supabase Admin API, which needs the
         SERVICE ROLE key — and that may never sit in a static page. So the
         writes live in an edge function, and this helper only ever sends
         the OPERATOR'S OWN session token, exactly as rpc() does.

         Two deliberate differences from rpc():
           · the anon key is never acceptable as the bearer here. bearerTok()
             falls back to it whenever there is no usable session, and that
             fallback must not be handed to a function that mints accounts,
             so it becomes a sign-in prompt instead.
           · a failure is rejected, not swallowed. The function writes its
             refusals for a human to read ("Centre 7 does not belong to this
             academy."), and every caller here shows that text verbatim.
             Swallowing it would leave the operator guessing.

         (The sales funnel view has a local `var fn` of its own; it shadows
         this harmlessly and never calls it.) */
      function fn(action, body) {
        return bearerTok().then(function (tok) {
          if (!tok || tok === KEY) {
            signOutToGate("Session expired — please sign in again.");
            throw new Error("Your session has expired. Sign in again.");
          }
          return fetch(PROJECT + "/functions/v1/access-admin", {
            method: "POST",
            headers: { apikey: KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign({ action: action }, body || {})),
          });
        }).then(function (r) {
          return r.text().then(function (txt) {
            var j = null;
            try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
            if (!r.ok) throw new Error((j && j.error) || ("The request failed (" + r.status + ")."));
            return j || {};
          });
        });
      }

      /* ============ sign-in gate ============ */
      var gate = document.getElementById("gate");
      function signOutToGate(msg) {
        localStorage.removeItem("am-session");
        if (!gate) return;
        gate.classList.remove("hide");
        var p = gate.querySelector("p");
        if (p && msg) p.textContent = msg;
      }
      var s0 = amSession();
      // A session with no refresh token cannot be renewed, and one whose
      // refresh window has passed is already dead. Hiding the gate for
      // either leaves the operator staring at an empty console.
      if (s0 && (!s0.access_token || !s0.refresh_token)) { localStorage.removeItem("am-session"); s0 = null; }
      if (s0) gate.classList.add("hide");
      document.getElementById("gateForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var fd = new FormData(this);
        fetch(PROJECT + "/auth/v1/token?grant_type=password", {
          method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
        }).then(function (r) { return r.json(); }).then(function (j) {
          var meta = (j.user && j.user.app_metadata) || {};
          if (j.access_token && meta.am_role === "operator") {
            localStorage.setItem("am-session", JSON.stringify({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: j.user.email, role: "operator" }));
            gate.classList.add("hide"); location.reload(); return;
          }
          throw new Error(j.access_token ? "not an operator account" : (j.error_description || "wrong credentials"));
        }).catch(function (err) { alert("Sign-in failed: " + err.message); });
      });

      /* ============ helpers ============ */
      function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
      function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return iso(d); }
      function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
      function inrK(n) { n = Number(n || 0); if (n >= 1e5) { var l = n / 1e5; return "₹" + (l >= 10 ? l.toFixed(1) : l.toFixed(2)) + "L"; } if (n >= 1000) return "₹" + Math.round(n / 1000) + "k"; return "₹" + n; }
      function num(n) { return Number(n || 0).toLocaleString("en-IN"); }
      function fmtDate(s) { try { return new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short" }); } catch (e) { return "—"; } }
      function agoH(h) { if (h == null) return "Never"; if (h < 1) return "Just now"; if (h < 24) return Math.round(h) + "h ago"; return Math.round(h / 24) + "d ago"; }
      var esc = function (s) { var d = document.createElement("i"); d.textContent = String(s == null ? "" : s); return d.innerHTML; };

      var CH = { Website: "#6366f1", Playo: "#10b981", Hudle: "#f59e0b", District: "#3b82f6", "Walk-in": "#94a3b8" };
      function sportIcon(sport) { return ({ Tennis: "sports_tennis", Cricket: "sports_cricket", Football: "sports_soccer", Badminton: "sports_tennis", Swimming: "pool", "Multi-sport": "exercise" })[sport] || "exercise"; }
      function tint(sport) { return ({ Tennis: ["#0f766e", "#f0fdfa"], Cricket: ["#b45309", "#fffbeb"], Badminton: ["#7c3aed", "#f5f3ff"], Football: ["#1d4ed8", "#eff6ff"], "Multi-sport": ["#be123c", "#fff1f2"], Swimming: ["#0369a1", "#f0f9ff"] })[sport] || ["#4b5563", "#f3f4f6"]; }
      /* Hoisted out of detailView on 2026-08-19. It lived inside that
         function, so any OTHER view that used it threw "card is not
         defined" the moment someone clicked — which broke the whole
         console once already today, and again the same afternoon when a
         second view was added. A shared helper declared inside one
         caller is a trap that resets every time somebody adds a view. */
      function card(title, meta, inner) { return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04)"><div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:14px;font-weight:700;letter-spacing:-0.01em">' + title + "</h3>" + (meta ? '<span style="font-size:12px;color:var(--tx4)">' + meta + "</span>" : "") + "</div>" + inner + "</div>"; }
      function healthStyle(h) { return ({ Active: ["#047857", "#ecfdf5"], Quiet: ["#b45309", "#fffbeb"], "At risk": ["#b91c1c", "#fef2f2"], Onboarding: ["#4338ca", "#eef2ff"], Emptied: ["#475569", "#f1f5f9"] })[h] || ["#475569", "#f1f5f9"]; }
      /* Four states, and only one of them is red.
         `overdue` used to fire on "status says overdue OR the date has
         passed", and every tenant was a pilot whose review date had
         passed — so the console showed money as late on accounts that
         had never been invoiced. Red now requires a PAYING account whose
         invoice date is behind it; a ₹0 account cannot be overdue,
         because nobody owes ₹0 late. `2026-08-19n`. */
      function billStyle(b) {
        return ({
          paying:   ["#047857", "#ecfdf5", "Paying"],
          overdue:  ["#b91c1c", "#fef2f2", "Overdue"],
          trial:    ["#1d4ed8", "#eff6ff", "Trial"],
          decide:   ["#b45309", "#fffbeb", "Trial ended"],
          free:     ["#4b5563", "#f3f4f6", "Free"],
          churned:  ["#4b5563", "#f3f4f6", "Churned"],
        })[b] || ["#4b5563", "#f3f4f6", "Free"];
      }

      function bars(vals, h, gap) {
        var max = Math.max.apply(null, vals.concat([1]));
        return '<div style="display:flex;align-items:flex-end;gap:' + (gap || 2) + 'px;height:' + h + 'px;width:100%">' +
          vals.map(function (v) { return '<div style="flex:1;min-height:2px;height:' + Math.max(6, Math.round(v / max * 100)) + '%;background:' + (v ? "var(--ac)" : "#eceef2") + ';border-radius:2px 2px 0 0"></div>'; }).join("") + "</div>";
      }
      // premium area+line sparkline (responsive width, crisp non-scaling stroke)
      var _sgn = 0;
      function spark(vals, h, color, draw) {
        color = color || "var(--ac)";
        vals = (vals || []).map(Number);
        if (!vals.length) vals = [0, 0];
        if (vals.length === 1) vals = [vals[0], vals[0]];
        var allZero = vals.every(function (v) { return !v; });
        var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
        var n = vals.length, W = 100, P = 3, ih = h - P * 2;
        function y(v) { var t = max === min ? 0.5 : (v - min) / (max - min); return (P + (1 - t) * ih).toFixed(2); }
        var pts = vals.map(function (v, i) { return (i / (n - 1) * W).toFixed(2) + " " + y(v); });
        if (allZero) { // flat baseline so an idle academy still reads as a line, not empty
          return '<svg class="spark" viewBox="0 0 ' + W + " " + h + '" preserveAspectRatio="none" style="height:' + h + 'px">' +
            '<path d="M0 ' + (h - P) + " L" + W + " " + (h - P) + '" style="stroke:#e2e5ea;stroke-width:1.4" vector-effect="non-scaling-stroke" fill="none"/></svg>';
        }
        var line = "M" + pts.join(" L");
        var area = "M0 " + h + " L" + pts.join(" L") + " L" + W + " " + h + " Z";
        var gid = "sg" + (++_sgn);
        return '<svg class="spark" viewBox="0 0 ' + W + " " + h + '" preserveAspectRatio="none" style="height:' + h + 'px;--len:210">' +
          '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".24"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
          '<path class="ln' + (draw ? " draw" : "") + '" d="' + line + '" style="stroke:' + color + '" vector-effect="non-scaling-stroke"/></svg>';
      }
      function mixBar(mix, h) {
        var keys = Object.keys(mix).sort(function (x, y) { return mix[y] - mix[x]; });
        var total = keys.reduce(function (s, k) { return s + mix[k]; }, 0) || 1;
        if (!keys.length) return '<div style="height:' + h + 'px;border-radius:' + (h / 2) + 'px;background:#eceef2"></div>';
        return '<div style="display:flex;height:' + h + 'px;border-radius:' + (h / 2) + 'px;overflow:hidden;gap:2px">' +
          keys.map(function (k) { return '<div style="width:' + (mix[k] / total * 100) + '%;background:' + (CH[k] || "#b9b7ac") + '"></div>'; }).join("") + "</div>";
      }
      function pill(text, colors, small) {
        var p = small ? "3px 8px 3px 7px" : "3px 10px 3px 8px", fs = small ? "11px" : "11.5px", dot = small ? 5 : 6;
        return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:' + fs + ';font-weight:600;padding:' + p + ';border-radius:20px;background:' + colors[1] + ';color:' + colors[0] + ';white-space:nowrap"><span style="width:' + dot + 'px;height:' + dot + 'px;border-radius:50%;background:' + colors[0] + '"></span>' + esc(text) + "</span>";
      }

      /* ============ state + data ============ */
      var state = { openDays: {}, appsBusy: false, appsErr: "", myLink: "", view: "overview", sel: null, sortKey: "gmv", sortDir: "desc", data: [], health: null, loaded: false, ev: {}, evLoading: {}, act: {}, actLoading: {},
        // sales pipeline — loaded lazily the first time the tab is opened,
        // so the console's boot cost is unchanged for everyone not selling.
        sales: { today: null, funnel: null, leads: [], ab: null, done: {},
                 loaded: false, loading: false, notice: "", again: false,
                 f: { priority: "", sport: "", stage: "", q: "", callable: true } } };

      // per-tenant raw activity — last 7 days of app events, fetched on demand
      /* ---------- usage, summarised by the database ----------
         activityCard() pulls up to 800 raw event rows and counts them in
         the browser, which answers "how many" and nothing else. This asks
         tenant_activity() instead: the same window, aggregated server-side
         into days, pages, devices and the actions that actually matter.

         The point of the device split: a client handed a live link opens
         it on a phone, and a layout only ever checked on a laptop is the
         commonest way a handover goes quiet without anyone reporting a
         bug. Counts only — the buckets cloud.js records, never a
         user-agent or anything identifying a person. */
      function loadActivity(id) {
        if (state.act[id] || state.actLoading[id]) return;
        state.actLoading[id] = true;
        rpc("tenant_activity", { p_tenant: id, p_days: 14 })
          .then(function (j) {
            state.act[id] = j || {};
            state.actLoading[id] = false;
            if (state.sel === id) render();
          })
          .catch(function () {
            /* A usage panel that cannot load must not blank the card it
               lives in — the academy's money and access matter more. */
            state.act[id] = { failed: true };
            state.actLoading[id] = false;
            if (state.sel === id) render();
          });
      }

      function usageStrip(id) {
        loadActivity(id);
        var a = state.act[id];
        if (!a) return '<div style="font-size:12.5px;color:var(--tx4);padding:10px 0">Loading usage…</div>';
        if (a.failed) return '<div style="font-size:12.5px;color:var(--tx4);padding:10px 0">Usage could not be read.</div>';

        function chips(list, empty) {
          if (!list || !list.length) return '<span style="font-size:12px;color:var(--tx4)">' + empty + "</span>";
          return list.map(function (x) {
            return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;' +
              'background:var(--fill);border:1px solid var(--bd3);border-radius:20px;padding:3px 9px;margin:0 6px 6px 0">' +
              esc(String(x.k || x.page)) +
              '<b style="font-variant-numeric:tabular-nums">' + num(x.n || x.views) + "</b></span>";
          }).join("");
        }

        var act = a.actions || {};
        var stat = [
          ["Visits", act.sessions || 0],
          ["Bookings tried", act.bookings || 0],
          ["Admissions", act.admissions || 0],
          ["Failed sign-ins", act.sign_in_failed || 0]
        ].map(function (p) {
          /* Failed sign-ins in red when there are any: it is the one number
             here that means somebody is stuck right now. */
          var red = p[0] === "Failed sign-ins" && p[1] > 0;
          return '<div style="flex:1 1 92px"><div style="font-size:11.5px;color:var(--tx4)">' + p[0] + "</div>" +
            '<div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:' +
            (red ? "#b45309" : "var(--tx)") + '">' + num(p[1]) + "</div></div>";
        }).join("");

        return '<div style="border-top:1px solid var(--bd3);margin-top:14px;padding-top:14px">' +
          '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">' + stat + "</div>" +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx4);margin-bottom:6px">Device</div>' +
          "<div>" + chips(a.devices, "no visits yet") + "</div>" +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx4);margin:8px 0 6px">Browser</div>' +
          "<div>" + chips(a.browsers, "—") + "</div>" +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tx4);margin:8px 0 6px">Most opened</div>' +
          "<div>" + chips(a.pages, "nothing opened yet") + "</div>" +
          '<div style="font-size:11px;color:var(--tx4);margin-top:10px">Last 14 days' +
            (a.last_seen ? " · last seen " + esc(String(a.last_seen).slice(0, 16).replace("T", " ")) + " UTC" : "") +
          "</div>" +
        "</div>";
      }

      function loadEvents(id, force) {
        /* The cache used to be permanent: once a tenant's events were
           read, nothing ever read them again. Opening the academy, going
           back and opening it again showed the same rows as at sign-in,
           so the only way to see new activity was a full page reload —
           and the operator had no way to know that. `force` is what the
           live refresh and re-entering a tenant use. */
        if ((state.ev[id] && !force) || state.evLoading[id]) return;
        state.evLoading[id] = true;
        get("/events?tenant_id=eq." + encodeURIComponent(id) + "&at=gte." + daysAgo(6) +
          "&order=at.desc&limit=800&select=name,props,page,session_id,at,visitor,ip")
          .then(function (rows) {
            state.ev[id] = rows || []; state.evLoading[id] = false;
            if (state.sel === id) render();
          });
      }

      /* ============================================================
         LIVE REFRESH

         Measured before choosing the intervals, because the two reads
         cost wildly different amounts:

             operator_portfolio()        421 ms   (40 subqueries x 7 tenants)
             events for one tenant       0.5 ms
             tenant_visitors()            43 ms

         So they poll at different rates. The open academy's activity is
         effectively free and refreshes often; the portfolio is expensive
         and refreshes rarely, plus whenever the tab regains focus —
         which is the moment an operator actually wants it, having just
         done something in a tenant app in another tab.

         Nothing polls while the tab is hidden. A console left open on a
         second monitor overnight should cost nothing. */
      var LIVE = { events: 15000, portfolio: 90000, timer: null,
                   portfolioAt: 0, at: 0, busy: false };

      function liveRefreshPortfolio() {
        if (LIVE.busy) return Promise.resolve();
        LIVE.busy = true;
        return rpc("operator_portfolio").then(function (rows) {
          if (rows) {
            state.data = rows.map(mapAccount).sort(function (x, y) { return y.gmv - x.gmv; });
            LIVE.portfolioAt = Date.now();
            LIVE.at = Date.now();
          }
        }).catch(function () {}).then(function () { LIVE.busy = false; render(); });
      }

      function liveRefreshOpen() {
        var id = state.sel;
        if (!id) return;
        loadEvents(id, true);
        /* The visitor list is its own read and its own cache; clearing
           the tenant marker is what makes detailView fetch it again. */
        if (state.visitors && state.visitors.tenant === id) state.visitors = null;
        LIVE.at = Date.now();
      }

      function liveTick() {
        if (typeof document !== "undefined" && document.hidden) return;
        if (!amSession()) return;
        if (state.sel) liveRefreshOpen();
        if (Date.now() - LIVE.portfolioAt > LIVE.portfolio) liveRefreshPortfolio();
      }

      function liveStart() {
        if (LIVE.timer) return;
        LIVE.timer = setInterval(liveTick, LIVE.events);
        /* Coming back to the tab is the strongest signal that something
           happened elsewhere — he has just been in a tenant app. */
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) { liveRefreshOpen(); liveRefreshPortfolio(); }
        });
        window.addEventListener("focus", function () { liveTick(); });
      }

      function liveAgo() {
        if (!LIVE.at) return "";
        var s = Math.round((Date.now() - LIVE.at) / 1000);
        return s < 5 ? "just now" : s < 60 ? s + "s ago" : Math.round(s / 60) + "m ago";
      }

      function usageArray(byDay) { var out = []; for (var i = 13; i >= 0; i--) out.push((byDay || {})[daysAgo(i)] || 0); return out; }
      function normWeekly(w) { w = (w || []).slice(-8); while (w.length < 8) w.unshift(0); return w; }
      function mapAccount(r) {
        var cfg = r.config || {}, lastAt = r.last_event_at || null;

        return '<div class="insight-toolbar"><div class="filter-group"><button><span class="mi">calendar_today</span><span><small>Date range</small>Last 8 weeks</span><span class="mi chevron">expand_more</span></button><button><span class="mi">compare_arrows</span><span><small>Compare to</small>Previous period</span><span class="mi chevron">expand_more</span></button></div><div class="toolbar-actions"><button>All academies<span class="mi chevron">expand_more</span></button><button class="export-btn"><span class="mi">ios_share</span>Export</button></div></div>' +

          '<section class="insight-card system-card"><div class="panel-head"><div><span class="eyebrow">PLATFORM SIGNAL</span><h2>System health</h2><p>Data delivery and channel reliability</p></div><span class="health-score ' + (healthScore >= 90 ? "good" : "warn") + '">' + healthScore + '%</span></div><div class="system-viz"><div class="system-bars">' + systemBars + '</div><div class="system-baseline"><span>6 checks ago</span><span>Latest</span></div></div><div class="system-stats"><span><b>' + stale + '</b> stale feeds</span><span><b>' + gaps + '</b> data gaps</span><span><b>' + pendingJobs + '</b> jobs queued</span></div></section></div>' +

      /* ============ Academies ============
         Reorganised 2026-08-19. What changed and why:

         · The 34-bar sparkline is gone. It plotted `usage_daily`, which
           counts rows in `events` — telemetry. It ranked mpp (301 events,
           0 members, 0 payments) above genalpha (81 paying families) for
           the single reason that mpp's app calls track() more often. A
           chart that rewards instrumentation on a business dashboard is
           worse than no chart.

         · "Activity · 30d" counts real writes — payments, members,
           bookings, sessions, applications, expenses — so it means the
           same thing for a coaching academy, a court venue and a turf
           ground, and cannot be gamed by a chattier client.

         · "Last change" is the last WRITE, not the last ping. raj's most
           recent event is days newer than its most recent row; opening
           the app is not using it.

         · Bookings and Players are gone from the card. Three tenants have
           no bookings and two have no enrolments, so both cells read "—"
           more often than not. They are shape-specific and belong in the
           detail, where the shape is known.

         Four cells, in the order the operator asks the questions: am I
         paid, is money moving, are they working, and when did they last
         do anything. */
      /* ============================================================
         OPEN APPS — one sign-in, then every tenant app is already open.

         WHY THIS WORKS AT ALL, and the constraint that shapes it:
         every tenant app is served from THIS origin,
         https://sujittarun.github.io, just on a different path. Same
         origin means one localStorage, so a session written here is a
         session those apps find. They only differ in which key they
         read.

         WHY IT ASKS FOR THE PASSWORD RATHER THAN COPYING THIS TAB'S
         SESSION. Copying would work for about an hour and then fail in
         a way that looks like a bug: all six apps would share one
         refresh token, and whichever refreshed first would rotate it
         and silently sign the other five out mid-demo. Calling the
         password grant once per app yields six INDEPENDENT sessions,
         which is what "stay logged in" actually requires.

         The password is used and dropped. It is never stored, never
         sent anywhere but Supabase's own token endpoint, and there is
         no value= on the field — this file is public.

         Two apps cannot be reached this way, and the card says so
         rather than quietly omitting them: MatchPoint Pride keeps its
         session in a PIN-encrypted vault, and GenAlpha is on its own
         domain, which is a different origin and therefore a different
         localStorage. */
      var APPS = [
        /* The repo is `mezzo-school-of-music`, not `Mezzo`, and Super
           Kings publishes from `SKAcademy`, not `SuperKingsAcademy`. Both
           were wrong here because they were inferred from the local folder
           name rather than fetched — and a launcher pointing at a 404 is
           worse than no launcher, because the session IS seeded and the
           only broken part is the link. The setup links below already
           had SKAcademy right; this list contradicted it. */
        { id: "mezzo",      name: "Mezzo School of Music", key: "mz-session",
          url: "https://sujittarun.github.io/mezzo-school-of-music/" },
        { id: "raj",        name: "Raj Sports",            key: "rs-session",
          url: "https://sujittarun.github.io/Rajsports/" },
        { id: "ska",        name: "Super Kings Academy",   key: "ska-cloud-session",
          url: "https://sujittarun.github.io/SKAcademy/" },
        { id: "leo",        name: "Leo Tennis Academy",    key: "lt-cloud-session",
          url: "https://sujittarun.github.io/LeoTennisAcademyapp/" },
        { id: "demo",       name: "Demo Sports Academy",   key: "amd-cloud-session",
          url: "https://sujittarun.github.io/AcademyManagerDemo/" },
        { id: "matchpoint", name: "MatchPoint (archived)", key: "mp-cloud-session",
          url: "https://sujittarun.github.io/MatchPoint/" },
      ];
      var ELSEWHERE = [
        { name: "Gen Alpha Cricket", url: "https://genalphaacademy.in/",
          why: "its own domain, so a different localStorage — sign in there once and it stays" },
        { name: "MatchPoint Pride", url: "https://sujittarun.github.io/MatchPointPride/",
          why: "keeps its session in a PIN-encrypted vault, on purpose — open it with the PIN" },
      ];

      function appsSeeded(a) {
        try {
          var raw = localStorage.getItem(a.key); if (!raw) return null;
          var s = JSON.parse(raw);
          return s && s.access_token && s.expires_at > Date.now() ? s : null;
        } catch (e) { return null; }
      }

      function appsView() {
        var live = APPS.filter(appsSeeded).length;
        var head = '<div class="page-head"><div><h1 class="page-title">Open apps</h1>' +
          '<p class="page-sub">Sign in once here and every academy app opens already signed in. ' +
          live + " of " + APPS.length + " ready.</p></div></div>";

        var rows = APPS.map(function (a) {
          var s = appsSeeded(a);
          return '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd3)">' +
            '<span style="width:9px;height:9px;border-radius:50%;background:' +
              (s ? "#16a34a" : "var(--bd2)") + '"></span>' +
            '<div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:600">' + esc(a.name) + "</div>" +
            '<div style="font-size:12px;color:var(--tx4)">' +
              (s ? "signed in until " + new Date(s.expires_at).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" })
                 : "not signed in yet") + "</div></div>" +
            '<a class="btn-g" href="' + esc(a.url) + '" target="_blank" rel="noopener"' +
              (s ? "" : ' style="opacity:.5;pointer-events:none"') + ">Open</a>" +
          "</div>";
        }).join("");

        var form = state.appsBusy
          ? '<div class="muted" style="padding:14px 0">Signing in to each app…</div>'
          : '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:14px">' +
              '<label style="flex:1;min-width:220px"><span style="display:block;font-size:12.5px;' +
                'color:var(--tx3);font-weight:600;margin-bottom:5px">Your password, once</span>' +
              /* No value=, ever. This page is on the open web. */
              '<input id="appsPw" type="password" autocomplete="current-password" ' +
                'style="width:100%;min-height:42px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;font-size:15px" /></label>' +
              '<button class="btn-p" id="appsGo" style="min-height:42px">Sign in to all apps</button>' +
            "</div>" +
            '<div class="muted" style="margin-top:8px;font-size:12.5px">Used once and dropped — never stored. ' +
              "Each app gets its own session, so refreshing one does not sign the others out.</div>";

        var others = ELSEWHERE.map(function (a) {
          return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd3)">' +
            '<div style="flex:1"><div style="font-size:14px;font-weight:600">' + esc(a.name) + "</div>" +

        return head +
          '<div class="dgrid"><div style="display:flex;flex-direction:column;gap:20px">' +

                 form) +
          "</div><div style=\"display:flex;flex-direction:column;gap:20px\">" +
            card("Signed in separately", "by design",
                 '<div style="margin-top:8px">' + others + "</div>") +
          "</div></div>";
      }

      /* One password grant per app. Six grants, six independent refresh
         tokens — see the note above for why sharing one would quietly
         break an hour into a demo. */
      function appsSignIn(pw) {
        /* The email comes from the console's own session — the same
           account, so the apps end up signed in as whoever is looking at
           this page, and there is no second identity to keep in step. */
        var me = amSession();
        var email = (me && me.email) || "";
        if (!email) { state.appsErr = "Could not tell which account you are signed in as. Sign out and back in."; return render(); }
        state.appsBusy = true; state.appsErr = ""; render();
        var done = 0, failed = [];
        Promise.all(APPS.map(function (a) {
          return fetch(PROJECT + "/auth/v1/token?grant_type=password", {
            method: "POST",
            headers: { apikey: KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: pw }),
          }).then(function (r) { return r.json(); }).then(function (j) {
            if (!j.access_token) throw new Error(j.error_description || j.msg || "sign-in failed");
            var meta = (j.user && j.user.app_metadata) || {};
            localStorage.setItem(a.key, JSON.stringify({
              access_token: j.access_token, refresh_token: j.refresh_token,
              expires_at: Date.now() + (j.expires_in || 3600) * 1000,
              email: j.user && j.user.email,
              role: meta.am_role || "", tenant: meta.tenant_id || "",
            }));
            done += 1;
          }).catch(function (e) { failed.push(a.name + ": " + e.message); });
        })).then(function () {
          state.appsBusy = false;
          state.appsErr = failed.length ? failed.join(" · ") : "";
          render();
        });
      }

            '<div style="display:flex;align-items:flex-start;gap:13px"><div style="width:44px;height:44px;border-radius:12px;background:' + t[1] + ';display:flex;align-items:center;justify-content:center;flex:none"><span class="mi" style="font-size:24px;color:' + t[0] + '">' + a.icon + '</span></div><div style="min-width:0;flex:1"><div style="font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(a.name) + '</div><div style="font-size:12px;color:var(--tx4)">' + esc(a.sub) + "</div></div>" + pill(a.health, healthStyle(a.health), true) + "</div>" +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd3)">' +
              /* Say "Paying" out loud. The old card showed no label at
                 all when an account was paid, which was fine when that
                 state was unremarkable — but an empty label is now
                 indistinguishable from a bug, and this is the only real
                 revenue the platform has. Amber still means something
                 needs doing; green means it does not. */
              cell("MRR", inr(a.mrr), bs[2],
                   a.bill === "overdue" ? "#dc2626"
                 : a.bill === "decide"  ? "#d97706"
                 : a.bill === "paying"  ? "#047857" : "#6b7280") +
              cell("GMV · 30d", a.gmv ? inrK(a.gmv) : "—", a.prev ? (gup ? "+" : "") + gpct + "%" : "", gup ? "#16a34a" : "#dc2626") +
              cell("Activity · 30d", num(a.actions),
                   apct == null ? (a.actions ? "new" : "") : (aup ? "+" : "") + apct + "%",
                   aup ? "#16a34a" : "#dc2626") +
              cell("Last change", a.wroteAt ? agoH(a.writeH) : "Never", "") +
            "</div>" +
            /* Same zero, two different stories. "Nothing recorded" is a
               warning for a tenant that never recorded anything; for one
               that was emptied it is simply false — MPP logged 123
               actions before its handover wipe. */
            (a.actions === 0 && a.events30 > 0
              ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--bd3);font-size:11.5px;display:flex;align-items:center;gap:6px;color:' + (a.didWork ? "var(--tx4)" : "#d97706") +

      function billingView(accts) {

        accts.forEach(function (a) {

        var summary = sum("Collected · MRR", inr(collected), "auto-billed this cycle", "#16a34a") + sum("Pending", inr(pending), "awaiting payment", "#d97706") + sum("Overdue", inr(overdue), od + " account" + (od === 1 ? "" : "s") + " past due", "#dc2626") + sum("Total MRR", inr(collected + pending + overdue), accts.length + " subscriptions", "#1a1d21");

            '<td style="padding:13px 18px"><div style="display:flex;align-items:center;gap:11px"><div style="width:32px;height:32px;border-radius:9px;background:' + t[1] + ';display:flex;align-items:center;justify-content:center;flex:none"><span class="mi" style="font-size:18px;color:' + t[0] + '">' + a.icon + '</span></div><span style="font-size:13.5px;font-weight:600">' + esc(a.name) + "</span></div></td>" +

      /* ============ sales pipeline ============
         Prospects we are selling TO, not tenants. Reads the operator-only
         sales_* RPCs; the tables live in a `sales` schema PostgREST does
         not expose, so this console is the only way in.

         The message templates are here rather than in Postgres because
         they are copy, not a rule — nothing computes off them. If step 3
         automates sending, they move to the database so the console and
         the sender cannot quote different words. */
      var SALES_TPL = {
        /* One opener, every sport.
           It used to branch per sport and carry a reference clause — "one
           runs 5 centres and about 100 students on ours, all on one screen"
           — plus a line asserting "You run several centres." Both were cut:

           · "one runs …" is a pronoun with no antecedent, and "all on one
             screen" is filler. It buried the only concrete fact behind the
             vaguest word in the sentence.
           · telling a prospect about their own business spends a line saying
             nothing, and 57 of the 112 numbers on this list are
             directory-sourced with scraped branch counts — so asserting
             their centre count risks being wrong on line three. Asking is
             safe; telling is not.
           · the customer reference is gone from message 1 on purpose. Our
             tenants are not names a cold prospect recognises, so naming one
             buys little here while competing with the question. Proof belongs
             in the REPLY, where "who are you?" is the most common thing they
             send and the detail actually lands. Keep tenant specifics out of
             this file either way — it is served on a public site.

           What is left is the academy's own name, what we do, and one
           question about the thing they do by hand every month. Do not edit
           this while the A/B test is running — both arms must send identical
           copy or the result means nothing. */
        _default:
          "Hi \u2014 is this {name}?\n\nI'm Sujit, from Academy Manager. I build software for sports academies.\n\nHow are you tracking batches and monthly fees right now \u2014 Excel, WhatsApp, or a register?"
      };

      /* GENERATION 2, from 2026-08-13. Generation 1 was sent to 30 academies
         and got zero replies, so the copy changed. Every line of the old
         opener did something an advertisement does:

           "I'm from Academy Manager"      a company with nobody behind it
           "We build branded apps for \u2026"   a positioning statement
           "batches, attendance, fees \u2026"   a feature list
           "Same if you're a coach \u2026"      a second segment pitch

         55 words, and the question came AFTER the pitch, so it read as a
         rhetorical set-up rather than curiosity. What replaced it:

         \u00b7 A name AND the company. "I'm Sujit, from Academy Manager." A
           person can be replied to and a company is checkable, so keep both.
           The earlier draft of this generation dropped the company entirely;
           that reads as evasive to a stranger, which is its own problem.
         \u00b7 Nothing after the company name but what we do, in one clause. A
           draft read "\u2026to support their day to day operations", which is the
           feature list wearing a different coat \u2014 every piece of software
           supports day-to-day operations, so it carries no information.
         \u00b7 A question with the choices supplied. "Excel" is a complete reply,
           which is the lowest-effort answer a busy person can give.
         \u00b7 No multi-centre line. It was requested for message 1 and is the
           most brochure-like sentence available; it moved to the reply
           playbook in marketing/leads/WHATSAPP-KIT.md.

         What still waits for the reply: what it actually DOES, the demo link
         and the tenant references. "Who are you?" is the most common reply,
         and the answer lands when it was asked for.

         About 30 words, down from 55. Do not edit while the A/B test runs \u2014
         both arms must send identical text or the comparison means nothing.
         If the copy changes again, bump SALES_GEN below AND
         sales_ab_generation() in the database, or the old and new sends get
         pooled into one reply rate. */

      /* The A/B arm comes from the DATABASE, never from the client.
         sales.leads.variant is a stored generated column over the lead id,
         so the console, a manual query and sales_ab_results() cannot
         disagree about who is in which arm — and nothing here can reassign
         a lead mid-test, which would make the result meaningless.
           A = text only
           B = same text, then one screenshot of the dues list */
      /* Which generation of the opener a touch was sent with. It is recorded
         on every touch as `<gen>_<arm>`, so a copy change does not pool the
         old sends and the new ones into one reply rate. Bump it whenever
         SALES_TPL changes; sales_ab_results() counts the current one only. */
      var SALES_GEN = "opener2";

      var SALES_AB = {
        A: { label: "text only", shot: false },
        B: { label: "+ screenshot", shot: true }
      };

      /* The console's esc() escapes & < > but not the double quote, because
         it round-trips through textContent, where there is no attribute
         context. That is fine everywhere it is used for text — and not fine
         here, because these rows are built from names and URLs scraped off
         third-party web pages, and this view puts them inside href and value
         attributes. A single quote in an academy name would break out of the
         attribute.

         So: escAttr for anything landing in an attribute, and safeUrl for
         the source link, which additionally refuses any scheme that is not
         http(s) — a scraped "javascript:" URL must not become clickable. */
      function escAttr(s) {
        return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function safeUrl(u) {
        return /^https?:\/\//i.test(String(u || "")) ? escAttr(u) : "";
      }

      function salesName(n) {
        var s = String(n || "").split(" / ")[0].trim(), prev;
        // Strip repeatedly until stable. One pass in a fixed order is not
        // enough: "Sportz Village (EduSports) - Hyderabad school cluster"
        // has a bracket that is only *trailing* once the " - suffix" is
        // gone, so a single ordered pass leaves "(EduSports)" behind.
        do {
          prev = s;
          s = s.replace(/\s+[-–]\s+.*$/, "")   // "- Hyderabad school cluster"
               .replace(/\s*\([^)]*\)\s*$/, "") // "(ARTA)", "(Kompally)"
               .trim();
        } while (s !== prev && s.length >= 3);
        return s.length >= 3 ? s : String(n || "").trim();
      }

      function salesMsg(l) {
        return SALES_TPL._default.replace("{name}", salesName(l.name));
      }

      /* Two different things were both called A/B/C, in the same table:
         the priority band (from the 0-10 score) and the A/B test arm. The
         database still stores 'A'/'B'/'C' and 'A'/'B' — those are fine as
         keys — but nothing user-facing shows a bare letter any more.

           priority band  ->  Hot / Warm / Cold
           test arm       ->  Text / Text + image                          */
      var PRI_LABEL = { A: "Hot", B: "Warm", C: "Cold" };
      var PRI_TONE  = { A: "#b45309", B: "#1d4ed8", C: "#6b7280" };
      var ARM_LABEL = { A: "Text", B: "Text + image" };

      var CONF_BADGE = {
        verified:  ["#047857", "#ecfdf5", "verified"],
        directory: ["#b45309", "#fffbeb", "directory"],
        malformed: ["#b91c1c", "#fef2f2", "check"],
        none:      ["#6b7280", "#f3f4f6", "no number"]
      };
      var STAGE_BADGE = {
        new: ["#4b5563", "#f3f4f6"], contacted: ["#1d4ed8", "#eff6ff"],
        replied: ["#047857", "#ecfdf5"], call_booked: ["#7c3aed", "#f5f3ff"],
        demo_done: ["#0e7490", "#ecfeff"], won: ["#047857", "#dcfce7"],
        lost: ["#6b7280", "#f3f4f6"]
      };

      /* Every sales write goes through here. rpc() resolves null on any
         failure and callers ran .then() regardless, so a refused write was
         indistinguishable from a saved one — which is how a jammed queue and
         ~15 unrecorded sends stayed invisible for a day. A write that does not
         come back with a row now says so on screen. */
      function salesWrite(name, args) {
        return rpc(name, args).then(function (r) {
          state.sales.notice = (r === null)
            ? "⚠ That did not save — nothing was recorded. Check the " +
              "connection and try again; the lead is still in the queue."
            : "";
          state.sales.loaded = false;
          loadSales();
          return r;
        });
      }

      function loadSales() {
        salesPrefetchImage();
        // a refresh asked for while one is in flight must not be dropped: the
        // write that triggered it would never appear.
        if (state.sales.loading) { state.sales.again = true; return; }
        state.sales.loading = true;
        var f = state.sales.f;
        // Four independent reads, fetched together. A round-trip to Tokyo is
        // ~180ms and is ~97% of each request, so serialising these would cost
        // most of the tab's load time for nothing.
        Promise.all([
          rpc("sales_today"),
          rpc("sales_leads", {
            p_priority: f.priority || null,
            p_sport: f.sport || null,
            p_stage: f.stage || null,
            p_search: f.q || null,
            p_callable: f.callable ? true : null,
            p_limit: 400
          }),
          rpc("sales_ab_results"),
          rpc("sales_funnel")
        ]).then(function (r) {
          state.sales.today = r[0] || null;
          state.sales.leads = r[1] || [];
          state.sales.ab = r[2] || null;
          state.sales.funnel = r[3] || null;
          state.sales.loading = false;
          state.sales.loaded = true;
          render();
          if (state.sales.again) { state.sales.again = false; loadSales(); }
        });
      }

      /* ONE write path for "what happened", mirroring sales_disposition().
         The old tab had five different ways to record an outcome and none of
         them scheduled a next step, which is how 39 academies were messaged
         once and then silently abandoned. */
      function salesDo(id, what, when, note) {
        var lead = salesFind(id);
        // Keep the row on screen after it is dispositioned, so the operator
        // gets confirmation and a way back. Without this the row simply
        // vanishes, which reads as "did that work?"
        if (!state.sales.done) state.sales.done = {};
        if (what === "undo") { delete state.sales.done[id]; }
        else {
          state.sales.done[id] = { what: what,
                                   name: (lead && lead.name) || "lead",
                                   when: when || null };
        }
        return salesWrite("sales_disposition", {
          p_lead: id, p_what: what, p_when: when || null, p_note: note || null,
          p_body: what === "messaged" && lead ? salesMsg(lead) : null,
          p_template: what === "messaged" && lead && lead.variant
                        ? SALES_GEN + "_" + lead.variant : null
        });
      }

      // Today's rows and the full lead table hold the same leads; either may
      // be the only one loaded, so look in both.
      function salesFind(id) {
        var t = ((state.sales.today && state.sales.today.rows) || [])
                  .filter(function (x) { return x.id === id; })[0];
        return t || state.sales.leads.filter(function (x) { return x.id === id; })[0];
      }

      /* Open the chat AND record the send in one action. The old tab opened a
         draft, then asked "did you send it?" — double entry, since the work
         was already done in WhatsApp, and eight real sends went unrecorded
         because the confirm step got skipped. You click this because you are
         sending; `Undo` covers the exception. */
      function salesMessage(id) {
        var lead = salesFind(id);
        if (!lead || !lead.phone) return false;
        var arm = SALES_AB[lead.variant] || SALES_AB.A;
        if (arm.shot) salesCopyImage();
        // window.open returns null whenever 'noopener' is set — that is
        // success, not failure — so nothing here may depend on the handle.
        window.open("https://wa.me/91" + String(lead.phone).replace(/\D/g, "") +
                    "?text=" + encodeURIComponent(salesMsg(lead)),
                    "_blank", "noopener");
        salesDo(id, "messaged");
        render();
        return true;
      }

      /* Arm B's image, on the clipboard.
         wa.me carries text only, so the attachment cannot ride along with the
         opener. The next best thing is to put the PNG on the clipboard when
         the chat opens, so the caller pastes with one keystroke instead of
         hunting for a file.

         The blob is pre-fetched when the tab loads: fetching it inside the
         click works in Chrome, but Safari treats the await as ending the user
         gesture and refuses the clipboard write. */
      var SALES_IMG = "assets/marketing/dashboard-dues.png";
      var salesImgBlob = null, salesImgTried = false;

      function salesPrefetchImage() {
        if (salesImgTried) return;
        salesImgTried = true;
        try {
          fetch(SALES_IMG).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.blob();
          }).then(function (b) { salesImgBlob = b; })
            .catch(function () { salesImgBlob = null; });
        } catch (e) { salesImgBlob = null; }
      }

      function salesCopyImage() {
        if (!salesImgBlob || !window.ClipboardItem ||
            !navigator.clipboard || !navigator.clipboard.write) return false;
        try {
          var item = {}; item[salesImgBlob.type || "image/png"] = salesImgBlob;
          navigator.clipboard.write([new ClipboardItem(item)]);
          return true;
        } catch (e) { return false; }
      }

      /* ── TODAY ──────────────────────────────────────────────────────────
         The whole workflow, replacing "work the queue by arm".

         WHY THE OLD SHAPE WAS WRONG. It organised the day around the A/B
         arms, which is a measurement, not a workflow — a salesperson opens
         their tool and asks "who do I talk to today?", never "which arm?".
         It also had exactly one touch in it: 39 academies were messaged once
         and then nothing, with next_action_on NULL on all 135 rows, so no
         query the console made could ever surface them again.

         The order comes from sales_today() in the database, not from here.
         Same reason reminder_queue() owns the fee ladder: the console, a
         manual query and any future client must not disagree about who is
         due. */
      var BUCKET = {
        reply:   { label: "REPLIED",     tone: "#047857", act: "chat" },
        meeting: { label: "CALL BOOKED", tone: "#7c3aed", act: "call" },
        demo:    { label: "OPENED DEMO", tone: "#b45309", act: "call" },
        snoozed: { label: "ASKED TODAY", tone: "#0369a1", act: "call" },
        due:     { label: "CALL DUE",    tone: "#0f766e", act: "call" },
        "new":   { label: "NEW",         tone: "#6b7280", act: "message" }
      };

      function salesTodayCard() {
        var t = state.sales.today;
        if (!t) return "";
        var rows = t.rows || [], c = t.counts || {};

        /* The cap is the one place this tool refuses the operator. 35 openers
           went out on 2026-08-14 against a safe ceiling of ~25 for a young
           number, and a restricted sender stops fee reminders for every live
           academy at once — so it has to be stated, not buried. */
        var over = (t.over_cap || 0) > 0;
        var capLine = over
          ? '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#991b1b;margin-top:11px">' +
            "<b>" + t.started + " new conversations today — " + t.over_cap +
            " over the safe daily limit of " + t.cap + ".</b> Send no more " +
            "openers today. A sender restricted for cold messaging stops fee " +
            "reminders for every live academy at once. Calls are unaffected." +
            "</div>"
          : '<div style="font-size:12px;color:var(--tx4);margin-top:9px">' +
            t.started + " of " + t.cap + " new conversations started today" +
            (t.held_back ? " · " + t.held_back + " fresh leads held back until tomorrow" : "") +
            "</div>";

        var order = ["reply", "meeting", "demo", "snoozed", "due", "new"];
        var chips = order.filter(function (k) { return c[k]; }).map(function (k) {
          var b = BUCKET[k];
          return '<span style="font-size:11.5px;font-weight:600;color:' + b.tone +
            ';background:var(--fill);border:1px solid var(--bd2);border-radius:20px;padding:3px 10px">' +
            c[k] + " " + b.label.toLowerCase() + "</span>";
        }).join(" ");

        var body = rows.length
          ? rows.map(salesTodayRow).join("")
          : '<div style="padding:30px 4px;text-align:center;color:var(--tx4);font-size:13px">' +
            (over
              ? "Nothing left to do today — and you are over the sending limit. Come back tomorrow."
              : "Nothing due. Every lead is either waiting on a scheduled date or spent.") +
            (t.held_back ? "<br /><span style=\"font-size:12px\">" + t.held_back +
                           " fresh leads unlock as the daily limit resets.</span>" : "") +
            "</div>";

        return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)">' +
          '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
          '<h3 style="font-size:15px;font-weight:700">Today</h3>' +
          '<span style="font-size:11.5px;color:var(--tx4)">worked top to bottom — replies first, then intent, then calls due</span>' +
          '<span style="flex:1"></span>' + chips + "</div>" +
          capLine +
          (state.sales.notice
            ? '<div style="margin-top:11px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:9px 12px;font-size:12px;color:#78350f">' +
              esc(state.sales.notice) + "</div>"
            : "") +
          '<div style="margin-top:13px">' + body + "</div>" +
          (t.spent ? '<div style="font-size:11.5px;color:var(--tx4);margin-top:11px;padding-top:10px;border-top:1px solid var(--bd3)">' +
                     t.spent + " lead" + (t.spent === 1 ? " is" : "s are") +
                     " spent — three attempts, no answer. Not dead, just out of reasons to call again.</div>" : "") +
          "</div>";
      }

      function salesTodayRow(l) {
        var b = BUCKET[l.bucket] || BUCKET["new"];
        var done = (state.sales.done || {})[l.id];
        var digits = String(l.phone || "").replace(/\D/g, "");

        // Already actioned this session: confirm it, and offer the way back.
        if (done) {
          var said = { messaged: "message sent", spoke: "spoke to them",
                       no_answer: "no answer", gatekeeper: "reached gatekeeper",
                       later: "snoozed", booked: "call booked",
                       not_interested: "not interested", no_whatsapp: "no WhatsApp",
                       stop: "suppressed", replied: "they replied" }[done.what] || done.what;
          return '<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px;margin-bottom:7px">' +
            '<span class="mi" style="color:#047857;font-size:17px">check_circle</span>' +
            '<div style="flex:1;min-width:150px;font-size:12.5px;color:#166534">' +
            "<b>" + esc(salesName(l.name)) + "</b> — " + esc(said) +
            (done.when ? ", back on " + esc(String(done.when)) : "") + "</div>" +
            '<button data-sdo="' + l.id + '|undo" style="border:1px solid var(--bd2);background:var(--card);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer">Undo</button>' +
            "</div>";
        }

        var primary = b.act === "message"
          ? '<button data-smsg="' + l.id + '" style="border:none;background:#059669;color:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer"><span class="mi" style="font-size:15px;vertical-align:-3px">chat</span> Message</button>'
          : (digits
              ? '<a href="tel:+91' + escAttr(digits) + '" data-scall="' + l.id + '" style="text-decoration:none;border:none;background:' + b.tone + ';color:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;display:inline-block"><span class="mi" style="font-size:15px;vertical-align:-3px">call</span> Call</a>'
              : "");

        var btn = function (what, label, title, extra) {
          return '<button data-sdo="' + l.id + "|" + what + '" title="' + escAttr(title) + '"' +
            ' style="border:1px solid ' + (extra ? "#fecaca" : "var(--bd2)") + ';background:' +
            (extra ? "#fef2f2" : "var(--card)") + ";color:" + (extra ? "#b91c1c" : "var(--tx2)") +
            ';border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer">' + label + "</button>";
        };

        // What can honestly happen next, and nothing else. The old strip
        // offered six outcomes on every row regardless of state.
        var acts = b.act === "message"
          ? btn("no_whatsapp", "No WhatsApp", "One grey tick — nothing arrived on this number") + " " +
            btn("stop", "Stop", "They asked us to stop — suppresses every number on this lead, permanently", 1)
          : btn("spoke", "Spoke", "Got through and talked — the best outcome on this list") + " " +
            btn("no_answer", "No answer", "Rang, nobody picked up. The cadence will schedule the next attempt") + " " +
            btn("gatekeeper", "Gatekeeper", "Reached a coach or the front desk, not the decision maker") + " " +
            '<span style="display:inline-flex;border:1px solid var(--bd2);border-radius:7px;overflow:hidden">' +
            '<span style="font-size:12px;color:var(--tx4);padding:5px 7px;background:var(--fill)">Later</span>' +
            '<button data-sdo="' + l.id + '|later|7" title="Come back in a week" style="border:none;border-left:1px solid var(--bd2);background:var(--card);padding:5px 8px;font-size:12px;cursor:pointer">1w</button>' +
            '<button data-sdo="' + l.id + '|later|30" title="Come back in a month" style="border:none;border-left:1px solid var(--bd2);background:var(--card);padding:5px 8px;font-size:12px;cursor:pointer">1m</button>' +
            '<button data-sdo="' + l.id + '|later|90" title="Come back in three months" style="border:none;border-left:1px solid var(--bd2);background:var(--card);padding:5px 8px;font-size:12px;cursor:pointer">3m</button></span> ' +
            btn("booked", "Booked", "They agreed to a call or a demo — asks for the date") + " " +
            btn("not_interested", "Not interested", "Lost. Asks why, because the funnel cannot answer that from a stage count", 1) + " " +
            btn("stop", "Stop", "They asked us to stop — permanent", 1);

        return '<div style="display:flex;align-items:flex-start;gap:12px;padding:11px;border:1px solid var(--bd2);border-left:3px solid ' + b.tone + ';border-radius:10px;margin-bottom:7px;flex-wrap:wrap">' +
          '<div style="flex:1;min-width:210px">' +
          '<div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">' +
          '<span style="font-size:10px;font-weight:700;color:' + b.tone + ';letter-spacing:.04em">' + b.label + "</span>" +
          '<span style="font-size:13.5px;font-weight:600">' + esc(salesName(l.name)) + "</span>" +
          '<span style="font-size:11px;color:var(--tx4)">' + l.score + "/10</span></div>" +
          '<div style="font-size:11.5px;color:var(--tx3);margin-top:2px">' + esc(l.reason || "") + "</div>" +
          '<div style="font-size:11.5px;color:var(--tx4);margin-top:2px">' +
          (l.phone ? '<span style="font-variant-numeric:tabular-nums;font-weight:600">' + esc(l.phone) + "</span> · " : "") +
          esc(l.sport || "—") + (l.area ? " · " + esc(l.area) : "") +
          ((l.branches || 1) >= 2 ? " · <b>" + l.branches + " centres</b>" : "") + "</div>" +
          (l.contact_name ? '<div style="font-size:11.5px;color:var(--tx4)">ask for ' + esc(l.contact_name) + "</div>" : "") +
          "</div>" +
          '<div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end">' +
          primary +
          '<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:430px">' + acts + "</div>" +
          "</div></div>";
      }

      function salesView() {
        var f = state.sales.f;
        var leads = state.sales.leads;

        if (!state.sales.loaded) {
          return '<div style="padding:48px;text-align:center;color:var(--tx4);font-size:13px">Loading pipeline…</div>';
        }

        var kpi = function (label, val, sub, tone) {
          return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px">' +
            '<div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.03em">' + label + "</div>" +
            '<div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;color:' + (tone || "inherit") + '">' + val + "</div>" +
            '<div style="font-size:11.5px;color:var(--tx4);margin-top:2px">' + sub + "</div></div>";
        };
        /* The funnel, not six unrelated counts. The question a pipeline has to
           answer is "where do leads die?", and a list of totals cannot — so
           each step shows what survived the one before it. */
        var fn = state.sales.funnel || {};
        var step = function (label, val, of, sub, tone) {
          var pct = (of && val != null) ? Math.round((val / of) * 1000) / 10 : null;
          return '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px">' +
            '<div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.03em">' + label + "</div>" +
            '<div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px;color:' + (tone || "inherit") + '">' + (val || 0) +
            (pct != null ? '<span style="font-size:12px;font-weight:600;color:var(--tx4)"> · ' + pct + "%</span>" : "") + "</div>" +
            '<div style="font-size:11.5px;color:var(--tx4);margin-top:2px">' + sub + "</div></div>";
        };
        var kpis = '<div class="cardgrid" style="margin-bottom:18px">' +
          step("REACHABLE", fn.reachable, null, (fn.total || 0) + " on the list") +
          step("CONTACTED", fn.contacted, fn.reachable, "of reachable") +
          step("ENGAGED", fn.engaged, fn.contacted, "replied or better", "#047857") +
