<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Choose a new password · Academy Manager</title>
  <meta name="robots" content="noindex" />
  <style>
  /* SELF-CONTAINED ON PURPOSE.
     The first version reused glass.css class names — .glass, .lt-grid,
     .field, .btn-primary — while loading console.css, which has none of
     them. Every one was a no-op, so the page rendered as raw unstyled
     inputs. The console and the tenant apps are two different design
     systems and this page belongs to neither: it is one card, on its own,
     so it carries its own dozen lines. */
  :root {
    --ink: #101f38; --ink-2: #5b6470; --ink-3: #8c94a0;
    --line: rgba(16,31,56,.14); --fill: #fff; --page: #f4f6fa;
    --gold: #f2c220; --gold-2: #d99a00; --red: #c2383f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center;
         padding: 24px; background: var(--page); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
  .card { width: min(400px, 100%); background: var(--fill); border: 1px solid var(--line);
          border-radius: 18px; padding: 28px 24px;
          box-shadow: 0 1px 2px rgba(16,31,56,.05), 0 12px 32px rgba(16,31,56,.09); }
  .head { text-align: center; margin-bottom: 22px; }
  .mark { width: 54px; height: 54px; margin: 0 auto 14px; display: grid; place-items: center; }
  .mark svg { border-radius: 15px; box-shadow: 0 3px 12px rgba(16,31,56,.22); }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .who { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; }
  label { display: block; margin-bottom: 14px; }
  label span { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
               text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
  input { width: 100%; padding: 11px 13px; font: inherit; color: var(--ink);
          background: #fbfcfe; border: 1px solid rgba(16,31,56,.2); border-radius: 10px; }
  input:focus { outline: none; border-color: var(--gold-2); background: #fff;
                box-shadow: 0 0 0 3px rgba(242,194,32,.22); }
  .rules { font-size: 12px; color: var(--ink-3); margin: -4px 0 14px; }
  .msg { font-size: 13px; min-height: 0; margin-bottom: 12px; }
  .msg.error { color: var(--red); }
  button.go { width: 100%; padding: 13px; font: inherit; font-weight: 700; cursor: pointer;
              color: #231d00; border: 0; border-radius: 999px;
              background: linear-gradient(135deg, #ffd75e, var(--gold-2));
              box-shadow: 0 6px 18px rgba(242,194,32,.35); }
  button.go[disabled] { opacity: .6; cursor: default; }
  .empty { text-align: center; padding: 8px 0 4px; }
  .empty b { display: block; font-size: 15px; margin-bottom: 4px; }
  .empty span { font-size: 13px; color: var(--ink-3); }
  .back { display: block; text-align: center; margin-top: 18px; font-size: 13px;
          color: var(--ink-2); text-decoration: none; }
  .back:hover { color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  
  <main>
    <div class="card">
      <div class="head">
        <!-- Inline, so this page needs no stylesheet and no script to
             show whose it is. Academy Manager's own mark, not a tenant's. -->
        <div class="mark">
          <svg viewBox="0 0 48 48" width="54" height="54" role="img" aria-label="Academy Manager">
            <defs><linearGradient id="amG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3d5a8a"/><stop offset="1" stop-color="#101f38"/>
            </linearGradient></defs>
            <rect width="48" height="48" rx="12" fill="url(#amG)"/>
            <path d="M0 12A12 12 0 0 1 12 0h24a12 12 0 0 1 12 12v5H0z" fill="#fff" opacity=".1"/>
            <path d="M12 34V16l6 9 6-9 6 9 6-9v18" fill="none" stroke="#f2c220"
                  stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Choose a new password</h1>
        <p class="who" id="who">Checking your link…</p>
      </div>

      <form id="form" hidden>
        <label>
          <span>New password</span>
          <!-- autocomplete=new-password so a password manager offers to
               generate and store one rather than filling the old value. -->
          <input type="password" id="pw1" autocomplete="new-password" required />
        </label>
        <label>
          <span>Type it again</span>
          <input type="password" id="pw2" autocomplete="new-password" required />
        </label>
        <div class="rules" id="pwRule"></div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button type="submit" class="go" id="save">Save the new password</button>
      </form>

      <div id="dead" hidden>
        <div class="empty">
          <b id="deadT">This link cannot be used</b>
          <span id="deadS"></span>
        </div>
      </div>

      <a class="back" href="./" id="backLink">← Back to the console</a>
    </div>
  </main>

  <script>
  /* ============================================================
     WHERE A PASSWORD RESET EMAIL LANDS

     Supabase sends the recovery token in the URL FRAGMENT — everything
     after the '#'. That matters twice over:

       · a fragment is never sent to the server, so this token does not
         appear in GitHub Pages' logs, in a proxy, or in a Referer header;
       · it also means the token is sitting in the address bar, so the
         first thing this page does after reading it is wipe it from the
         URL with replaceState.

     This page is the ONLY place in the app that takes a password, and it
     takes one the person is choosing for themselves. Nothing is stored
     here and nothing is logged; the value goes straight to Supabase's
     /auth/v1/user and is then out of scope.
     ============================================================ */
  /* THE ONE NUMBER.

     Supabase's policy for this project is password_min_length = 6 with
     no character requirements, and the SERVER is the authority. A
     stricter rule here only rejects passwords the server would have
     accepted — on a page someone reaches once, from a link, usually on
     a phone, often while a class is waiting.

     It had drifted to 10 here and 12 in the access-admin function,
     matching neither the server nor each other, so "the minimum"
     depended on which door you came through. Change this one line and
     the two inputs, the validation and the sentence under them all
     follow. scripts/check-reset.js fails if a second number appears. */
  var MIN_PW = 6;

  /* Applied to the DOM rather than typed into the markup, so the number
     exists once. A minlength attribute would be a second copy, and a
     second copy is how this drifted in the first place. */
  (function () {
    var r = document.getElementById("pwRule");
    if (r) r.textContent = "At least " + MIN_PW + " characters. A short phrase you will " +
                           "remember beats a clever short one.";
    ["pw1", "pw2"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.setAttribute("minlength", String(MIN_PW));
    });
  })();

  (function () {
    "use strict";
    var $ = function (s) { return document.querySelector(s); };

    var PROJECT = "https://ugsklcipzyiogxynshnh.supabase.co";
    /* The public anon key, same one index.html carries. Public by design:
       it is the key every browser must present, and it grants nothing on
       its own — this page's authority comes from the one-time token in the
       link, not from this. */
    var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnc2tsY2lwenlpb2d4eW5zaG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTUyMzksImV4cCI6MjA5ODQ3MTIzOX0.w7xkjdTkYN2qA0oxMKLUNtua0ScKVHKQzfEyIayh9eo";

    function hashParams() {
      var h = String(location.hash || "").replace(/^#/, "");
      var out = {};
      h.split("&").forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf("=");
        if (i < 0) return;
        out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      });
      return out;
    }

    function dead(title, detail) {
      $("#form").hidden = true;
      $("#dead").hidden = false;
      $("#who").textContent = "";
      $("#deadT").textContent = title;
      $("#deadS").textContent = detail;
    }

    var p = hashParams();
    var token = p.access_token || "";

    /* Take the token out of the address bar immediately. A recovery link
       left in history is a live credential in the browser's back button. */
    if (location.hash) {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    }

    if (p.error_description || p.error) {
      dead("That link has expired",
           (p.error_description || p.error) + " — ask for a new one from the sign-in page.");
      return;
    }
    if (!token) {
      dead("Open this from the email",
           "This page needs the one-time link sent to your address. Use the key icon in the console sidebar to get one.");
      return;
    }
    if (p.type && p.type !== "recovery" && p.type !== "invite" && p.type !== "signup") {
      dead("That link is not a password reset", "Ask for a new one from the console.");
      return;
    }

    /* Ask the auth server who this token belongs to, rather than trusting
       what the link says. It also proves the token is still valid BEFORE
       the person types a new password into a form that would then fail. */
    fetch(PROJECT + "/auth/v1/user", {
      headers: { apikey: KEY, Authorization: "Bearer " + token }
    }).then(function (r) {
      if (!r.ok) throw new Error("expired");
      return r.json();
    }).then(function (u) {
      $("#who").textContent = "for " + (u && u.email ? u.email : "your account");
      $("#form").hidden = false;
    }).catch(function () {
      dead("That link has expired",
           "Recovery links are single-use and short-lived. Ask for a new one from the console.");
    });

    $("#form").addEventListener("submit", function (e) {
      e.preventDefault();
      var a = $("#pw1").value, b = $("#pw2").value, msg = $("#msg"), btn = $("#save");
      msg.className = "msg";

      if (a.length < MIN_PW) {
        msg.textContent = "Use at least " + MIN_PW + " characters.";
        msg.className = "msg error";
        return;
      }
      if (a !== b) {
        msg.textContent = "The two passwords do not match.";
        msg.className = "msg error";
        return;
      }

      btn.disabled = true;
      msg.textContent = "Saving…";
      fetch(PROJECT + "/auth/v1/user", {
        method: "PUT",
        headers: {
          apikey: KEY,
          Authorization: "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password: a })
      }).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "Could not save it.");
          return j;
        });
      }).then(function () {
        /* Deliberately does NOT sign them in here. The point of the next
           screen is to prove the new password works, and finding that out
           now beats finding out tomorrow morning. */
        $("#form").hidden = true;
        $("#dead").hidden = false;
        $("#who").textContent = "";
        $("#deadT").textContent = "Password changed";
        $("#deadS").textContent = "Sign in to the console with the new one.";
      }).catch(function (err) {
        btn.disabled = false;
        msg.textContent = (err && err.message) || "Could not save it.";
        msg.className = "msg error";
      });
    });
  })();
  </script>
</body>
</html>
